<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siddhendra Kala Kshetram — Library</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tiro+Telugu:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --parchment:#F3ECD9;
    --card:#FBF7EC;
    --ink:#2B2118;
    --ink-soft:#5A4E3E;
    --maroon:#7A2E2E;
    --maroon-dark:#5C2020;
    --gold:#B08D3F;
    --teal:#2F4B3C;
    --line:#DED2AF;
    --danger:#8C2E2E;
    --shadow: 0 2px 10px rgba(43,33,24,0.08);
    --radius: 10px;
    --serif: 'Tiro Telugu', Georgia, 'Times New Roman', serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'JetBrains Mono', 'Courier New', monospace;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      repeating-linear-gradient(135deg, rgba(176,141,63,0.05) 0px, rgba(176,141,63,0.05) 2px, transparent 2px, transparent 14px),
      var(--parchment);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
  }

  /* ---------- top ribbon ---------- */
  .ribbon{
    background: linear-gradient(180deg, var(--maroon) 0%, var(--maroon-dark) 100%);
    color:#F3ECD9;
    padding:18px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    box-shadow: var(--shadow);
    border-bottom: 3px solid var(--gold);
  }
  .ribbon h1{
    font-family:var(--serif);
    font-weight:400;
    font-size:22px;
    margin:0;
    letter-spacing:0.3px;
  }
  .ribbon .sub{
    font-size:12px;
    opacity:0.8;
    margin-top:2px;
    letter-spacing:0.5px;
    text-transform:uppercase;
  }
  .ribbon-right{ display:flex; align-items:center; gap:14px; }

  .status-pill{
    font-family:var(--mono);
    font-size:11px;
    padding:5px 10px;
    border-radius:20px;
    display:flex;
    align-items:center;
    gap:6px;
    background:rgba(0,0,0,0.18);
    white-space:nowrap;
  }
  .dot{ width:7px; height:7px; border-radius:50%; background:#7FA88C; }
  .dot.off{ background:#D9A441; }
  .dot.busy{ background:#D9A441; animation:pulse 1.2s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  button{
    font-family:var(--sans);
    cursor:pointer;
    border:none;
    border-radius:7px;
    padding:9px 16px;
    font-size:13px;
    font-weight:600;
    transition:transform 0.06s ease, opacity 0.15s ease;
  }
  button:active{ transform:scale(0.97); }
  .btn-primary{ background:var(--gold); color:#2B2118; }
  .btn-primary:hover{ opacity:0.9; }
  .btn-ghost{ background:rgba(255,255,255,0.12); color:#F3ECD9; }
  .btn-ghost:hover{ background:rgba(255,255,255,0.2); }
  .btn-outline{ background:transparent; border:1.5px solid var(--maroon); color:var(--maroon); }
  .btn-outline:hover{ background:rgba(122,46,46,0.06); }
  .btn-danger{ background:transparent; color:var(--danger); border:1.5px solid var(--danger); }
  .btn-danger:hover{ background:rgba(140,46,46,0.06); }
  .btn-small{ padding:6px 10px; font-size:12px; }
  button:disabled{ opacity:0.45; cursor:not-allowed; }

  .wrap{ max-width:1080px; margin:0 auto; padding:28px 20px 80px; }

  /* ---------- setup / login screens ---------- */
  .center-screen{
    min-height:calc(100vh - 40px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:36px 34px;
    width:100%;
    max-width:440px;
  }
  .panel-wide{ max-width:620px; }
  .panel h2{
    font-family:var(--serif);
    font-weight:400;
    font-size:24px;
    margin:0 0 6px;
    color:var(--maroon-dark);
  }
  .panel p.hint{ color:var(--ink-soft); font-size:13px; line-height:1.5; margin:0 0 22px; }
  label{ display:block; font-size:12px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.4px; margin:14px 0 6px; }
  label:first-of-type{ margin-top:0; }
  input, select, textarea{
    width:100%;
    padding:10px 12px;
    border:1.5px solid var(--line);
    border-radius:7px;
    font-family:var(--sans);
    font-size:14px;
    background:#fff;
    color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--gold); }
  textarea{ resize:vertical; min-height:70px; }
  .form-actions{ display:flex; gap:10px; margin-top:22px; }
  .error-msg{
    background:#FBEAEA; color:var(--danger); border:1px solid #E7B9B9;
    padding:9px 12px; border-radius:7px; font-size:13px; margin-top:14px;
  }
  .ok-msg{
    background:#EAF2EC; color:var(--teal); border:1px solid #BFD8C7;
    padding:9px 12px; border-radius:7px; font-size:13px; margin-top:14px;
  }
  .link-btn{ background:none; border:none; color:var(--maroon); font-size:12.5px; text-decoration:underline; padding:2px 0; font-weight:500; }

  /* ---------- toolbar ---------- */
  .toolbar{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    margin-bottom:18px; flex-wrap:wrap;
  }
  .search-box{
    flex:1; min-width:220px;
    position:relative;
  }
  .search-box input{
    padding-left:34px;
    background:var(--card);
  }
  .search-box::before{
    content:"⌕"; position:absolute; left:11px; top:50%; transform:translateY(-50%);
    color:var(--ink-soft); font-size:16px;
  }
  .toolbar-actions{ display:flex; gap:8px; flex-wrap:wrap; }

  /* ---------- tabs ---------- */
  .tabs{
    max-width:1080px; margin:0 auto; padding:16px 20px 0; display:flex; gap:6px;
  }
  .tab-btn{
    background:transparent; color:var(--ink-soft); border:none; border-bottom:2.5px solid transparent;
    border-radius:0; padding:8px 4px; margin-right:18px; font-size:13.5px; font-weight:600;
  }
  .tab-btn.active{ color:var(--maroon-dark); border-bottom-color:var(--gold); }
  .tab-btn:hover{ color:var(--maroon-dark); }

  .register-head{
    font-family:var(--serif); font-size:15px; color:var(--maroon-dark);
    padding:14px 16px; border-bottom:1px solid var(--line);
  }

  /* ---------- table ---------- */
  .table-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  thead th{
    text-align:left;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:var(--ink-soft);
    background:rgba(176,141,63,0.10);
    padding:11px 14px;
    border-bottom:1.5px solid var(--line);
    font-weight:700;
  }
  tbody td{
    padding:11px 14px;
    border-bottom:1px solid var(--line);
    vertical-align:top;
  }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:rgba(176,141,63,0.06); }
  .book-title{ font-weight:600; color:var(--maroon-dark); }
  .book-meta{ color:var(--ink-soft); font-size:12px; margin-top:2px; }
  .badge{
    display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:600;
  }
  .badge-avail{ background:#EAF2EC; color:var(--teal); }
  .badge-out{ background:#FBEAEA; color:var(--danger); }
  .row-actions{ display:flex; gap:6px; }
  .empty-state{ text-align:center; padding:60px 20px; color:var(--ink-soft); }
  .empty-state .big{ font-family:var(--serif); font-size:19px; color:var(--maroon-dark); margin-bottom:6px; }

  /* ---------- modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(43,33,24,0.45);
    display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal{
    background:var(--card); border-radius:var(--radius); box-shadow:0 10px 40px rgba(0,0,0,0.25);
    width:100%; max-width:480px; padding:28px 30px; max-height:90vh; overflow-y:auto;
  }
  .modal h3{ font-family:var(--serif); font-weight:400; font-size:20px; margin:0 0 18px; color:var(--maroon-dark); }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }

  /* ---------- users panel ---------- */
  .user-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; border-bottom:1px solid var(--line);
  }
  .user-row:last-child{ border-bottom:none; }
  .role-tag{
    font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px;
    padding:2px 8px; border-radius:20px; background:rgba(176,141,63,0.18); color:var(--gold-dark, #8a6b28);
  }
  .role-tag.admin{ background:rgba(122,46,46,0.12); color:var(--maroon); }

  footer.credit{ text-align:center; color:var(--ink-soft); font-size:11.5px; padding:30px 0 10px; }

  /* ---------- landing page ---------- */
  .landing{ min-height:100vh; display:flex; flex-direction:column; }
  .landing-nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 34px; max-width:1080px; margin:0 auto; width:100%;
  }
  .landing-nav .mark{ font-family:var(--serif); font-size:17px; color:var(--maroon-dark); }
  .thread-motif{ width:100%; overflow:hidden; line-height:0; }
  .landing-hero{
    flex:1; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:40px 24px 60px;
  }
  .landing-hero-inner{ max-width:640px; }
  .eyebrow{
    font-family:var(--mono); font-size:11.5px; letter-spacing:1.6px; text-transform:uppercase;
    color:var(--gold); margin-bottom:18px; display:inline-block;
  }
  .landing-hero h1{
    font-family:var(--serif); font-weight:400; font-size:46px; line-height:1.15;
    color:var(--maroon-dark); margin:0 0 4px;
  }
  .landing-hero h1 span{ display:block; font-size:22px; color:var(--ink-soft); font-style:italic; margin-top:6px; }
  .landing-tagline{
    font-size:15.5px; color:var(--ink-soft); line-height:1.65; max-width:480px;
    margin:22px auto 34px;
  }
  .landing-cta{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .btn-lg{ padding:13px 26px; font-size:14px; }

  .landing-section{ max-width:1080px; margin:0 auto; padding:10px 24px 60px; width:100%; }
  .landing-section h2{
    font-family:var(--serif); font-weight:400; font-size:22px; color:var(--maroon-dark);
    text-align:center; margin:0 0 8px;
  }
  .landing-section .lede{ text-align:center; color:var(--ink-soft); font-size:13.5px; max-width:520px; margin:0 auto 32px; line-height:1.6; }

  .category-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:16px; }
  .category-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px 18px; text-align:center; box-shadow:var(--shadow);
  }
  .category-card .num{
    font-family:var(--mono); font-size:11px; color:var(--gold); letter-spacing:1px; margin-bottom:10px; display:block;
  }
  .category-card h3{ font-family:var(--serif); font-weight:400; font-size:16px; color:var(--maroon-dark); margin:0 0 6px; }
  .category-card p{ font-size:12px; color:var(--ink-soft); line-height:1.5; margin:0; }

  .landing-footer{ text-align:center; padding:24px 20px 34px; color:var(--ink-soft); font-size:11.5px; border-top:1px solid var(--line); }

  /* ---------- toast ---------- */
  #global-toast{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
    background:var(--ink); color:#F3ECD9; padding:11px 18px; border-radius:8px;
    font-size:13px; box-shadow:0 6px 20px rgba(0,0,0,0.25); z-index:200;
    max-width:90vw; display:none;
  }
  #global-toast.toast-error{ background:var(--danger); }
  #global-toast.toast-ok{ background:var(--teal); }

  /* ---------- stats bar ---------- */
  .stats-bar{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .stat-chip{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:10px 16px; min-width:100px; box-shadow:var(--shadow);
  }
  .stat-num{ font-family:var(--serif); font-size:20px; color:var(--maroon-dark); }
  .stat-label{ font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.4px; margin-top:2px; }

  @media (max-width:760px){
    .category-grid{ grid-template-columns:1fr 1fr; }
    .landing-hero h1{ font-size:34px; }
  }
  @media (max-width:480px){
    .category-grid{ grid-template-columns:1fr; }
  }

  /* ---------- print ---------- */
  @media print{
    .no-print{ display:none !important; }
    body{ background:#fff; }
    .table-card{ box-shadow:none; border:none; }
    thead th{ background:#eee !important; -webkit-print-color-adjust:exact; }
  }

  @media (max-width:600px){
    .grid-2{ grid-template-columns:1fr; }
    .ribbon{ flex-direction:column; align-items:flex-start; }
    thead{ display:none; }
    table, tbody, tr, td{ display:block; width:100%; }
    tbody tr{ border-bottom:2px solid var(--line); padding:10px 0; }
    tbody td{ border-bottom:none; padding:4px 14px; }
    tbody td::before{ content: attr(data-label); font-weight:700; text-transform:uppercase; font-size:10px; color:var(--ink-soft); display:block; }
  }
</style>

<!-- Firebase and xlsx load lazily, only once "Sign in" is clicked — see ensureFirebaseSDK() below. -->
<script>
  function loadScript(src){
    return new Promise(function(resolve, reject){
      const s = document.createElement('script');
      s.src = src; s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    });
  }
  let _firebaseSdkLoaded = false;
  function ensureFirebaseSDK(){
    if(_firebaseSdkLoaded) return Promise.resolve();
    return loadScript('https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js')
      .then(function(){
        return Promise.all([
          loadScript('https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js'),
          loadScript('https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js'),
          loadScript('https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js')
        ]);
      })
      .then(function(){ _firebaseSdkLoaded = true; });
  }
</script>

<script>
(function(){
  "use strict";

  const root = document.getElementById('root');
  const CONFIG_KEY = 'skk_lib_firebase_config';
  const ROLE_CACHE_KEY = 'skk_lib_role_cache';

  // Embedded so the app works out of the box on any device/host with no setup step.
  const EMBEDDED_CONFIG = {
    apiKey: "AIzaSyD24jrS3IFcOzztK8mjhHNhgDnPaiajZxs",
    authDomain: "kuchipudi-kala-kshetram-lib.firebaseapp.com",
    projectId: "kuchipudi-kala-kshetram-lib",
    storageBucket: "kuchipudi-kala-kshetram-lib.firebasestorage.app",
    messagingSenderId: "466278077648",
    appId: "1:466278077648:web:eeecb30d321530965f7ad5"
  };

  const CATEGORIES = ["Donated Books", "Telugu University", "Vistara Seva Vibhagam", "UGC"];

  let app=null, auth=null, db=null, secondaryApp=null;
  let currentUser=null;
  let currentUserName=null;
  let currentRole=null; // 'admin' | 'readonly'
  let books=[]; // live cache from Firestore snapshot
  let unsubscribeBooks=null;
  let loans=[]; // live cache of borrow/return records
  let unsubscribeLoans=null;
  let searchTerm='';
  let categoryFilter='';
  let netStatus = navigator.onLine ? 'checking' : 'offline'; // checking | online | offline
  let catalogLoading = false;

  // ---------------- user-facing write/error feedback ----------------
  let toastTimer=null;
  function showToast(message, isError){
    let t = document.getElementById('global-toast');
    if(!t){ t = document.createElement('div'); t.id='global-toast'; document.body.appendChild(t); }
    t.textContent = message;
    t.className = isError ? 'toast-error' : 'toast-ok';
    t.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.style.display='none'; }, 4000);
  }

  function withRoman(b){ b._titleRoman = teluguToRoman(b.title); b._authorRoman = teluguToRoman(b.author); return b; }

  // ---------------- utility ----------------
  function el(tag, attrs, children){
    const e = document.createElement(tag);
    if(attrs) for(const k in attrs){
      if(k==='class') e.className=attrs[k];
      else if(k==='html') e.innerHTML=attrs[k];
      else if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
      else if(k==='disabled' || k==='checked' || k==='selected' || k==='readonly'){
        if(attrs[k]) e.setAttribute(k, '');
      }
      else e.setAttribute(k, attrs[k]);
    }
    (children||[]).forEach(c=>{ if(c) e.appendChild(typeof c==='string'?document.createTextNode(c):c); });
    return e;
  }
  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function fmtDate(ts){
    if(!ts) return '—';
    try{
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'});
    }catch(e){ return '—'; }
  }

  // ============================================================
  // SEARCH ENGINE: accession-number-first ordering + fuzzy Telugu/English matching
  // ============================================================

  // Approximate Telugu -> Roman phonetic transliteration, so an English-typed
  // query ("konchem") can fuzzy-match Telugu text ("కొంచెం") without the person
  // needing a Telugu keyboard. This is phonetic, not a formal transliteration
  // standard — good enough for search, not meant to be linguistically exact.
  const TG_VOWELS = {'అ':'a','ఆ':'aa','ఇ':'i','ఈ':'ii','ఉ':'u','ఊ':'uu','ఋ':'ru','ౠ':'ruu','ఌ':'lu','ౡ':'luu','ఎ':'e','ఏ':'ee','ఐ':'ai','ఒ':'o','ఓ':'oo','ఔ':'au'};
  const TG_CONS = {'క':'ka','ఖ':'kha','గ':'ga','ఘ':'gha','ఙ':'nga','చ':'cha','ఛ':'chha','జ':'ja','ఝ':'jha','ఞ':'nya','ట':'ta','ఠ':'tha','డ':'da','ఢ':'dha','ణ':'na','త':'ta','థ':'tha','ద':'da','ధ':'dha','న':'na','ప':'pa','ఫ':'pha','బ':'ba','భ':'bha','మ':'ma','య':'ya','ర':'ra','ల':'la','వ':'va','శ':'sha','ష':'sha','స':'sa','హ':'ha','ళ':'la','ఱ':'ra','ఴ':'la'};
  const TG_MATRA = {'ా':'aa','ి':'i','ీ':'ii','ు':'u','ూ':'uu','ృ':'ru','ౄ':'ruu','ె':'e','ే':'ee','ై':'ai','ొ':'o','ో':'oo','ౌ':'au'};
  const TG_VIRAMA = '్', TG_ANUSVARA = 'ం', TG_VISARGA = 'ః', TG_CHANDRABINDU = 'ఁ';

  function teluguToRoman(str){
    if(!str) return '';
    const chars = Array.from(String(str));
    let out = '';
    for(let i=0;i<chars.length;i++){
      const ch = chars[i];
      if(TG_CONS[ch]){
        const base = TG_CONS[ch], stem = base.slice(0,-1); // strip inherent trailing 'a'
        const next = chars[i+1];
        if(next===TG_VIRAMA){ out += stem; i++; }
        else if(next && TG_MATRA[next]){ out += stem + TG_MATRA[next]; i++; }
        else { out += base; }
      } else if(TG_VOWELS[ch]){
        out += TG_VOWELS[ch];
      } else if(ch===TG_ANUSVARA){ out += 'm'; }
      else if(ch===TG_VISARGA){ out += 'h'; }
      else if(ch===TG_CHANDRABINDU){ out += 'n'; }
      else if(ch===TG_VIRAMA){ /* stray, skip */ }
      else { out += ch.toLowerCase(); }
    }
    return out;
  }

  function normalizeSearchText(s){
    return String(s||'').toLowerCase().replace(/[\[\]().,\-–—'"]/g, '').replace(/\s+/g, ' ').trim();
  }

  function levenshtein(a, b){
    if(a===b) return 0;
    if(!a.length) return b.length;
    if(!b.length) return a.length;
    let prev = new Array(b.length+1);
    for(let j=0;j<=b.length;j++) prev[j]=j;
    for(let i=1;i<=a.length;i++){
      const cur = [i];
      for(let j=1;j<=b.length;j++){
        cur[j] = Math.min(
          prev[j]+1,
          cur[j-1]+1,
          prev[j-1] + (a[i-1]===b[j-1] ? 0 : 1)
        );
      }
      prev = cur;
    }
    return prev[b.length];
  }

  // Returns 0 (no match), 2 (fuzzy match), or 3 (direct substring match) for query vs one text field.
  function fuzzyFieldScore(query, text){
    if(!query || !text) return 0;
    const nq = normalizeSearchText(query), nt = normalizeSearchText(text);
    if(!nq || !nt) return 0;
    if(nt.indexOf(nq) > -1) return 3;
    const threshold = nq.length<=3 ? 1 : Math.max(1, Math.floor(nq.length*0.3));
    const words = nt.split(' ');
    for(let i=0;i<words.length;i++){
      const w = words[i];
      if(!w) continue;
      const clip = w.length>nq.length ? w.slice(0, nq.length+2) : w;
      if(levenshtein(nq, clip) <= threshold) return 2;
    }
    return 0;
  }

  // Best score for query against a Telugu field, checking both the raw text
  // and its Roman transliteration (so English typing matches Telugu content).
  function fuzzyTeluguScore(query, rawText, romanText){
    return Math.max(fuzzyFieldScore(query, rawText), fuzzyFieldScore(query, romanText));
  }

  // Natural sort for accession numbers like "01", "1800", "A 01", "D178", "L 849" —
  // groups by leading letters, then compares the numeric part as a number.
  function parseAccession(acc){
    const s = String(acc||'').trim();
    const m = s.match(/^([A-Za-z]*)\s*0*(\d+)(.*)$/);
    if(m) return {prefix:m[1].toUpperCase(), num:parseInt(m[2],10), rest:m[3].trim(), raw:s};
    return {prefix:'', num:Number.MAX_SAFE_INTEGER, rest:s, raw:s};
  }
  function compareAccession(a, b){
    const pa = parseAccession(a), pb = parseAccession(b);
    if(pa.prefix !== pb.prefix) return pa.prefix.localeCompare(pb.prefix);
    if(pa.num !== pb.num) return pa.num - pb.num;
    if(pa.rest !== pb.rest) return pa.rest.localeCompare(pb.rest);
    return pa.raw.localeCompare(pb.raw);
  }

  // Ranks a book against a search query: accession-number matches always
  // outrank title/author matches, per the register's own numbering being
  // the primary way books are found; title/author are complementary.
  function scoreBookAgainstQuery(book, query){
    if(!query) return 1; // no query — everything matches, sort falls through to accession order
    const accScore = fuzzyFieldScore(query, book.accessionNo);
    if(accScore>0) return 1000 + accScore;
    const titleScore = fuzzyTeluguScore(query, book.title, book._titleRoman);
    const authorScore = fuzzyTeluguScore(query, book.author, book._authorRoman);
    const categoryScore = fuzzyFieldScore(query, book.category);
    const isbnScore = fuzzyFieldScore(query, book.isbn);
    return Math.max(titleScore, authorScore, categoryScore, isbnScore);
  }

  function sortAndFilterBooks(list, query){
    const q = (query||'').trim();
    const scored = list.map(function(b){ return {book:b, score:scoreBookAgainstQuery(b, q)}; })
      .filter(function(x){ return x.score>0; });
    scored.sort(function(x,y){
      if(y.score !== x.score) return y.score - x.score;
      return compareAccession(x.book.accessionNo, y.book.accessionNo);
    });
    return scored.map(function(x){ return x.book; });
  }

  function enterGuestCatalog(){
    currentUser = null;
    currentRole = 'guest';
    currentUserName = null;
    currentView = 'catalog';
    if(unsubscribeLoans){ unsubscribeLoans(); unsubscribeLoans=null; }
    if(unsubscribeBooks){ unsubscribeBooks(); unsubscribeBooks=null; }

    catalogLoading = true;
    books = [];
    renderApp();

    // Public reads never touch Firestore — this is a plain HTTP request to the
    // Python backend, which keeps its own live-synced copy. The browser's normal
    // HTTP cache (via the server's ETag/Cache-Control headers) handles repeat
    // visits; there's no custom caching code here at all.
    fetch('/api/books')
      .then(function(res){
        if(!res.ok) throw new Error('status ' + res.status);
        return res.json();
      })
      .then(function(data){
        books = data.map(withRoman);
        catalogLoading = false;
        netStatus = 'online';
        renderApp();
      })
      .catch(function(){
        // Most likely this file is open locally (e.g. admin's desktop copy)
        // with no Python server behind it — that's fine, sign in instead.
        catalogLoading = false;
        netStatus = 'offline';
        books = [];
        renderApp();
      });
  }

  function friendlyAuthError(err){
    const map = {
      'auth/invalid-email':'That email address looks invalid.',
      'auth/user-disabled':'This account has been disabled.',
      'auth/user-not-found':'No account with that email.',
      'auth/wrong-password':'Incorrect password.',
      'auth/invalid-credential':'Incorrect email or password.',
      'auth/network-request-failed':'No network — sign in needs internet the first time on a device.',
      'auth/too-many-requests':'Too many attempts. Wait a bit and try again.',
      'auth/email-already-in-use':'That email is already registered.',
      'auth/weak-password':'Password should be at least 6 characters.'
    };
    return map[err.code] || (err.message || 'Something went wrong signing in.');
  }

  function buildStatsBar(){
    const live = books.filter(function(b){ return !b.deleted; });
    const totalBooks = live.length;
    const totalCopies = live.reduce(function(s,b){ return s+Number(b.copiesTotal||0); }, 0);
    const availCopies = live.reduce(function(s,b){ return s+Number(b.copiesAvailable!=null?b.copiesAvailable:b.copiesTotal||0); }, 0);
    const outCopies = Math.max(0, totalCopies-availCopies);
    const bar = el('div', {class:'stats-bar no-print'});
    [
      [totalBooks, 'titles'],
      [totalCopies, 'total copies'],
      [availCopies, 'available'],
      [outCopies, 'checked out']
    ].forEach(function(pair){
      const stat = el('div', {class:'stat-chip'});
      stat.appendChild(el('div', {class:'stat-num'}, [String(pair[0])]));
      stat.appendChild(el('div', {class:'stat-label'}, [pair[1]]));
      bar.appendChild(stat);
    });
    return bar;
  }

      };

      const proceed = function(){
        saveBook(existing ? existing.id : null, data, existing);
        closeModal();
      };

      if(!accNo){ proceed(); return; }
      saveBtn.disabled = true;
      db.collection('books').where('accessionNo','==',accNo).limit(5).get().then(function(snap){
        saveBtn.disabled = false;
        const clash = snap.docs.find(function(d){ return d.id !== (existing?existing.id:null) && !d.data().deleted; });
        if(clash){
          const otherTitle = clash.data().title || 'another book';
          if(!confirm('Accession "'+accNo+'" is already used by "'+otherTitle+'". Save anyway?')) return;
        }
        proceed();
      }).catch(function(){
        saveBtn.disabled = false;
        proceed(); // best-effort check only — don't block saving if the check itself fails (e.g. offline)
      });
    }}, [existing ? 'Save changes' : 'Add to catalog']);
    actions.appendChild(saveBtn);
    modal.appendChild(actions);

    backdrop.appendChild(modal);
    root.appendChild(backdrop);
    titleInp.focus();
  }

  function saveBook(id, data, existing){
    if(!db) return;
    const promise = id
      ? db.collection('books').doc(id).set(data, {merge:true})
      : (function(){ data.addedAt = firebase.firestore.FieldValue.serverTimestamp(); return db.collection('books').add(data); })();
    promise.catch(function(err){
      showToast('Could not save the book: ' + (err.message||'unknown error'), true);
    });
  }

    db.collection('books').doc(id).set({deleted:true, updatedAt: firebase.firestore.FieldValue.serverTimestamp()}, {merge:true})

  function guessColumnMapping(header, sampleValue){
    const h = String(header||'').toLowerCase();
    if(h.indexOf('గ్రంధ')>-1 || h.indexOf('పుస్తక')>-1 || h.indexOf('title')>-1) return 'title';
    if(h.indexOf('రచయిత')>-1 || h.indexOf('author')>-1) return 'author';
    if(h.indexOf('పేజీ')>-1 || h.indexOf('page')>-1) return 'pages';
    if(h.indexOf('సంవత్సర')>-1 || h.indexOf('year')>-1) return 'year';
    if(h.indexOf('ప్రచురణకర్త')>-1 || h.indexOf('publisher')>-1) return 'publisher';
    if(h.indexOf('isbn')>-1) return 'isbn';
    if(h.indexOf('క్రమ')>-1 || h.indexOf('సంఖ్య')>-1){
      const sv = String(sampleValue||'').trim();
      if(sv && /[A-Za-z]/.test(sv)) return 'accessionNo'; // alphanumeric id like "A 01" — a real accession no
      return ''; // plain running serial number — not useful as an id, ignore by default
    }
    return '';
  }

  function uploadImportedBooks(dataRows, header, mapping, category, filename, onProgress){
    const colFor = {};
    mapping.forEach(function(field, idx){ if(field) colFor[field]=idx; });

    const rows = dataRows.map(function(row){
      if(colFor.title==null) return null;
      const title = String(row[colFor.title]||'').trim();
      if(!title) return null;
      const get = function(key){ return colFor[key]!=null ? String(row[colFor[key]]||'').trim() : ''; };
      return {
        title: title,
        author: get('author'),
        accessionNo: get('accessionNo'),
        pages: get('pages'),
        year: get('year'),
        publisher: get('publisher'),
        isbn: get('isbn'),
        category: category,
        copiesTotal: 1,
        copiesAvailable: 1,
        deleted: false,
        importedFrom: filename,
        addedAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };
    }).filter(Boolean);

    const CHUNK = 400;
    const chunks = [];
    for(let i=0;i<rows.length;i+=CHUNK) chunks.push(rows.slice(i, i+CHUNK));

    let uploaded = 0;
    function next(i){
      if(i>=chunks.length){ return Promise.resolve({count: uploaded}); }
      const batch = db.batch();
      chunks[i].forEach(function(rowData){
        batch.set(db.collection('books').doc(), rowData);
      });
      return batch.commit().then(function(){
        uploaded += chunks[i].length;
        if(onProgress) onProgress(uploaded, rows.length);
        return next(i+1);
      });
    }
    return next(0);
  }

  function todayStr(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function normalizeMobile(m){
    let digits = String(m||'').replace(/\D/g,'');
    if(digits.length>10) digits = digits.slice(-10); // strip country code like +91
    return digits;
  }
  function isValidMobile(m){
    return /^[0-9]{10}$/.test(normalizeMobile(m));
  }
  // Date strings are 'YYYY-MM-DD', which compare correctly with plain string comparison.
  function isValidBorrowDate(dateStr){
    return !!dateStr && dateStr <= todayStr();
  }
  function isValidReturnDate(dateStr, borrowDateStr){
    return !!dateStr && dateStr <= todayStr() && (!borrowDateStr || dateStr >= borrowDateStr);
  }
  function fmtDateStr(s){
    if(!s) return '—';
    const parts = String(s).split('-');
    if(parts.length!==3) return s;
    const d = new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
    return d.toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'});
  }
  function daysBetween(startStr){
    if(!startStr) return '—';
    const parts = startStr.split('-');
    const start = new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
    const diff = Math.round((new Date().setHours(0,0,0,0) - start.setHours(0,0,0,0)) / 86400000);
    return diff + (diff===1?' day':' days');
  }

    return container;
  }

  // ---------------- borrow modal ----------------
  function renderBorrowModal(){
    const book = books.find(function(b){ return b.id===borrowModalBookId; });
    if(!book){ borrowModalBookId=null; return; }
    const closeBorrow = function(){ borrowModalBookId=null; renderApp(); };

    const backdrop = el('div', {class:'modal-backdrop', onclick:function(e){ if(e.target===backdrop) closeBorrow(); }});
    const modal = el('div', {class:'modal'});
    modal.appendChild(el('h3', null, ['Borrow: ' + book.title]));

    const avail = Number(book.copiesAvailable!=null?book.copiesAvailable:book.copiesTotal||0);
    modal.appendChild(el('p', {class:'hint'}, [avail + ' of ' + (book.copiesTotal||0) + ' copies available.']));

    const nameInp = el('input', {type:'text', placeholder:'Full name'});
    const mobileInp = el('input', {type:'tel', placeholder:'10-digit mobile number'});
    const dateInp = el('input', {type:'date', value: todayStr()});

    modal.appendChild(el('label', null, ['Borrower name']));
    modal.appendChild(nameInp);
    modal.appendChild(el('label', null, ['Borrower mobile number']));
    modal.appendChild(mobileInp);
    modal.appendChild(el('label', null, ['Date of borrowing']));
    modal.appendChild(dateInp);

    const errHolder = el('div');
    modal.appendChild(errHolder);

    const actions = el('div', {class:'form-actions'});
    actions.appendChild(el('button', {class:'btn-outline', onclick:closeBorrow}, ['Cancel']));
    const submitBtn = el('button', {class:'btn-primary', style:'flex:1', disabled: avail<=0, onclick:function(){
      errHolder.innerHTML='';
      const name = nameInp.value.trim(), mobile = mobileInp.value.trim(), date = dateInp.value;
      if(!name || !mobile || !date){
        errHolder.appendChild(el('div',{class:'error-msg'},['Name, mobile number and date are all required.']));
        return;
      }
      if(!isValidMobile(mobile)){
        errHolder.appendChild(el('div',{class:'error-msg'},['Enter a valid 10-digit mobile number.']));
        return;
      }
      if(!isValidBorrowDate(date)){
        errHolder.appendChild(el('div',{class:'error-msg'},['Borrowing date can\u2019t be in the future.']));
        return;
      }
      submitBtn.disabled = true;
      borrowBook(book, name, normalizeMobile(mobile), date).then(function(){
        showToast('Borrowing recorded.');
        closeBorrow();
      }).catch(function(err){
        submitBtn.disabled = false;
        errHolder.innerHTML='';
        errHolder.appendChild(el('div',{class:'error-msg'},[err.message || 'Could not record the loan.']));
      });
    }}, ['Record borrowing']);
    actions.appendChild(submitBtn);
    modal.appendChild(actions);

    backdrop.appendChild(modal);
    root.appendChild(backdrop);
    nameInp.focus();
  }

  function borrowBook(book, name, mobile, date){
    const bookRef = db.collection('books').doc(book.id);
    const loanRef = db.collection('loans').doc();
    return db.runTransaction(function(tx){
      return tx.get(bookRef).then(function(doc){
        if(!doc.exists) throw new Error('That book no longer exists.');
        const avail = Number(doc.data().copiesAvailable!=null ? doc.data().copiesAvailable : doc.data().copiesTotal||0);
        if(avail<=0) throw new Error('No copies available to borrow.');
        tx.update(bookRef, {copiesAvailable: avail-1, updatedAt: firebase.firestore.FieldValue.serverTimestamp()});
        tx.set(loanRef, {
          bookId: book.id,
          bookTitle: book.title,
          borrowerName: name,
          borrowerMobile: mobile,
          borrowDate: date,
          returnDate: null,
          returnerName: null,
          returnerMobile: null,
          status: 'out',
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          createdBy: currentUser.uid
        });
      });
    });
  }

  // ---------------- return modal ----------------
  function renderReturnModal(){
    const loan = loans.find(function(l){ return l.id===returnModalLoanId; });
    if(!loan){ returnModalLoanId=null; return; }
    const closeReturn = function(){ returnModalLoanId=null; renderApp(); };

    const backdrop = el('div', {class:'modal-backdrop', onclick:function(e){ if(e.target===backdrop) closeReturn(); }});
    const modal = el('div', {class:'modal'});
    modal.appendChild(el('h3', null, ['Return: ' + loan.bookTitle]));
    modal.appendChild(el('p', {class:'hint'}, ['Borrowed by ' + loan.borrowerName + ' (' + loan.borrowerMobile + ') on ' + fmtDateStr(loan.borrowDate) + '.']));

    const dateInp = el('input', {type:'date', value: todayStr()});
    modal.appendChild(el('label', null, ['Date of return']));
    modal.appendChild(dateInp);

    const sameWrap = el('label', {style:'display:flex; align-items:center; gap:8px; text-transform:none; font-weight:500; letter-spacing:0; font-size:13px; color:var(--ink); margin-top:16px;'});
    const sameCheck = el('input', {type:'checkbox', style:'width:auto;'});
    sameWrap.appendChild(sameCheck);
    sameWrap.appendChild(document.createTextNode('Same person is returning it'));
    modal.appendChild(sameWrap);

    const returnerNameInp = el('input', {type:'text', placeholder:'Full name'});
    const returnerMobileInp = el('input', {type:'tel', placeholder:'10-digit mobile number'});
    modal.appendChild(el('label', null, ['Returned by — name']));
    modal.appendChild(returnerNameInp);
    modal.appendChild(el('label', null, ['Returned by — mobile number']));
    modal.appendChild(returnerMobileInp);

    sameCheck.addEventListener('change', function(){
      if(sameCheck.checked){
        returnerNameInp.value = loan.borrowerName || '';
        returnerMobileInp.value = loan.borrowerMobile || '';
        returnerNameInp.disabled = true;
        returnerMobileInp.disabled = true;
      } else {
        returnerNameInp.value = '';
        returnerMobileInp.value = '';
        returnerNameInp.disabled = false;
        returnerMobileInp.disabled = false;
      }
    });

    const errHolder = el('div');
    modal.appendChild(errHolder);

    const actions = el('div', {class:'form-actions'});
    actions.appendChild(el('button', {class:'btn-outline', onclick:closeReturn}, ['Cancel']));
    const submitBtn = el('button', {class:'btn-primary', style:'flex:1', onclick:function(){
      errHolder.innerHTML='';
      const date = dateInp.value;
      const rName = returnerNameInp.value.trim(), rMobile = returnerMobileInp.value.trim();
      if(!date || !rName || !rMobile){
        errHolder.appendChild(el('div',{class:'error-msg'},['Return date, and the returning person\u2019s name and mobile number, are all required.']));
        return;
      }
      if(!isValidMobile(rMobile)){
        errHolder.appendChild(el('div',{class:'error-msg'},['Enter a valid 10-digit mobile number.']));
        return;
      }
      if(!isValidReturnDate(date, loan.borrowDate)){
        errHolder.appendChild(el('div',{class:'error-msg'},['Return date can\u2019t be before the borrowing date or in the future.']));
        return;
      }
      submitBtn.disabled = true;
      returnBook(loan, date, rName, normalizeMobile(rMobile), sameCheck.checked).then(function(){
        showToast('Return recorded.');
        closeReturn();
      }).catch(function(err){
        submitBtn.disabled = false;
        errHolder.innerHTML='';
        errHolder.appendChild(el('div',{class:'error-msg'},[err.message || 'Could not record the return.']));
      });
    }}, ['Record return']);
    actions.appendChild(submitBtn);
    modal.appendChild(actions);

    backdrop.appendChild(modal);
    root.appendChild(backdrop);
  }

  function returnBook(loan, returnDate, returnerName, returnerMobile, sameAsBorrower){
    const bookRef = db.collection('books').doc(loan.bookId);
    const loanRef = db.collection('loans').doc(loan.id);
    return db.runTransaction(function(tx){
      return tx.get(bookRef).then(function(doc){
        const data = doc.exists ? doc.data() : {copiesAvailable:0, copiesTotal:0};
        const total = Number(data.copiesTotal||0);
        const avail = Number(data.copiesAvailable||0);
        const newAvail = total>0 ? Math.min(avail+1, total) : avail+1;
        if(doc.exists){
          tx.update(bookRef, {copiesAvailable:newAvail, updatedAt: firebase.firestore.FieldValue.serverTimestamp()});
        }
        tx.update(loanRef, {
          status:'returned',
          returnDate: returnDate,
          returnerName: returnerName,
          returnerMobile: returnerMobile,
          sameAsBorrower: !!sameAsBorrower,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      });
    });
  }

  // ============================================================
  // USERS MODAL (admin: create logins, set roles)
  // ============================================================
  let userList=[];
  function renderUsersModal(){
    const backdrop = el('div', {class:'modal-backdrop', onclick:function(e){ if(e.target===backdrop){ usersModalOpen=false; renderApp(); } }});
    const modal = el('div', {class:'modal'});
    modal.appendChild(el('h3', null, ['Manage logins']));
    modal.appendChild(el('p', {class:'hint'}, ['Create a login for library staff. Admins can add/edit/remove books and manage logins. Read-only logins can search, view and print the catalog.']));

    const nameInp = el('input', {type:'text', placeholder:'Full name'});
    const emailInp = el('input', {type:'email', placeholder:'staff@example.com'});
    const passInp = el('input', {type:'text', placeholder:'Temporary password (min 6 characters)'});
    const roleSel = el('select');
    roleSel.appendChild(el('option', {value:'readonly'}, ['Read-only']));
    roleSel.appendChild(el('option', {value:'admin'}, ['Admin']));

    modal.appendChild(el('label', null, ['Name']));
    modal.appendChild(nameInp);
    modal.appendChild(el('label', null, ['Email']));
    modal.appendChild(emailInp);
    modal.appendChild(el('label', null, ['Temporary password']));
    modal.appendChild(passInp);
    modal.appendChild(el('label', null, ['Role']));
    modal.appendChild(roleSel);

    const errHolder = el('div');
    modal.appendChild(errHolder);

    const createBtn = el('button', {class:'btn-primary', style:'margin-top:16px; width:100%;', onclick:function(){
      errHolder.innerHTML='';
      const name = nameInp.value.trim();
      const email = emailInp.value.trim(), pass = passInp.value;
      if(!name){
        errHolder.appendChild(el('div',{class:'error-msg'},['Enter a name.']));
        return;
      }
      if(!email || pass.length<6){
        errHolder.appendChild(el('div',{class:'error-msg'},['Enter an email and a password of at least 6 characters.']));
        return;
      }
      createBtn.disabled = true;
      createLogin(name, email, pass, roleSel.value).then(function(){
        usersModalOpen=false; renderApp();
        showToast('Login created for ' + email + '.');
      }).catch(function(err){
        createBtn.disabled = false;
        errHolder.innerHTML='';
        errHolder.appendChild(el('div',{class:'error-msg'},[friendlyAuthError(err)]));
      });
    }}, ['Create login']);
    modal.appendChild(createBtn);

    modal.appendChild(el('div', {style:'border-top:1px solid var(--line); margin:22px 0 12px;'}));
    modal.appendChild(el('label', null, ['Existing logins']));
    const listHolder = el('div', {class:'table-card', style:'margin-top:6px;'});
    listHolder.appendChild(el('div', {style:'padding:14px; color:var(--ink-soft); font-size:13px;'}, ['Loading…']));
    modal.appendChild(listHolder);

    const closeBtn = el('button', {class:'btn-outline', style:'margin-top:18px; width:100%;', onclick:function(){ usersModalOpen=false; renderApp(); }}, ['Close']);
    modal.appendChild(closeBtn);

    backdrop.appendChild(modal);
    root.appendChild(backdrop);
    emailInp.focus();

    db.collection('roles').get().then(function(snap){
      listHolder.innerHTML='';
      if(snap.empty){
        listHolder.appendChild(el('div', {style:'padding:14px; color:var(--ink-soft); font-size:13px;'}, ['No logins yet besides you.']));
        return;
      }
      snap.forEach(function(doc){
        const d = doc.data();
        const row = el('div', {class:'user-row'});
        row.appendChild(el('span', null, [(d.name ? d.name + ' — ' : '') + (d.email || doc.id)]));
        row.appendChild(el('span', {class:'role-tag ' + (d.role==='admin'?'admin':'')}, [d.role || 'readonly']));
        listHolder.appendChild(row);
      });
    }).catch(function(err){
      listHolder.innerHTML='';
      listHolder.appendChild(el('div', {style:'padding:14px; color:var(--ink-soft); font-size:13px;'}, ['Could not load logins (offline?).']));
    });
  }

  function createLogin(name, email, pass, role){
    const cfg = getConfig() || EMBEDDED_CONFIG;
    if(!secondaryApp){
      secondaryApp = firebase.apps.find(a=>a.name==='Secondary') || firebase.initializeApp(cfg, 'Secondary');
    }
    const secondaryAuth = secondaryApp.auth();
    return secondaryAuth.createUserWithEmailAndPassword(email, pass).then(function(cred){
      const uid = cred.user.uid;
      return secondaryAuth.signOut().then(function(){
        return db.collection('roles').doc(uid).set({
          name: name,
          email: email,
          role: role,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          createdBy: currentUser.uid
        });
      });
    });
  }

  // ============================================================
  // BOOT / AUTH FLOW
  // ============================================================
  function subscribeBooks(){
    if(unsubscribeBooks) unsubscribeBooks();
    catalogLoading = false;
    unsubscribeBooks = db.collection('books').onSnapshot(function(snap){
      books = snap.docs.map(function(d){ return withRoman(Object.assign({id:d.id}, d.data())); });
      netStatus = (snap.metadata.fromCache && !navigator.onLine) ? 'offline' : (navigator.onLine ? 'online' : 'offline');
      if(document.getElementById('table-holder')){ renderTableOnly(); renderStatusOnly(); }
    }, function(err){
      console.error('books snapshot error', err);
      showToast('Lost the connection to the catalog — it will retry automatically.', true);
    });
  }

  function subscribeLoans(){
    if(unsubscribeLoans) unsubscribeLoans();
    unsubscribeLoans = db.collection('loans').onSnapshot(function(snap){
      loans = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      if(currentView==='register' && document.getElementById('view-holder')) renderViewOnly();
    }, function(err){
      console.error('loans snapshot error', err);
      showToast('Lost the connection to the borrowing register — it will retry automatically.', true);
    });
  }

  let everSignedIn = false;

  function boot(){
    if(!auth){ renderSetup(); return; }
    auth.onAuthStateChanged(function(user){
      if(!user){
        currentUser=null; currentRole=null; currentUserName=null;
        if(unsubscribeBooks){ unsubscribeBooks(); unsubscribeBooks=null; }
        if(unsubscribeLoans){ unsubscribeLoans(); unsubscribeLoans=null; }
        if(everSignedIn){ enterGuestCatalog(); } else { renderLogin(); }
        return;
      }
      everSignedIn = true;
      currentUser = user;
      netStatus = navigator.onLine ? 'online' : 'offline';

      db.collection('roles').doc(user.uid).get().then(function(doc){
        if(doc.exists){
          const d = doc.data();
          currentRole = d.role === 'admin' ? 'admin' : 'readonly';
          currentUserName = d.name || null;
          cacheRole(user.uid, currentRole);
        } else {
          currentRole = getCachedRole(user.uid) || 'readonly';
        }
        subscribeBooks();
        subscribeLoans();
        renderApp();
      }).catch(function(){
        currentRole = getCachedRole(user.uid) || 'readonly';
        subscribeBooks();
        subscribeLoans();
        renderApp();
      });
    });
  }

  // Called by the "Sign in" button — this is the only thing that ever triggers
  // loading the Firebase SDK or making a Firebase network call. Nothing before
  // this point (public browsing) touches Firebase in any way.
  function startSignIn(){
    ensureFirebaseSDK().then(function(){
      const activeConfig = getConfig() || EMBEDDED_CONFIG;
      const ok = initFirebase(activeConfig);
      if(!ok){
        renderSetup(JSON.stringify(activeConfig, null, 2), 'Could not connect. Check the config and try again.');
        return;
      }
      boot();
    }).catch(function(){
      showToast('Could not load sign-in — check your connection.', true);
    });
  }

  // ---------------- entry point ----------------
  // Default state: public catalog view, served entirely by the Python backend.
  // No Firebase code loads and no Firebase calls happen until startSignIn() runs.
  enterGuestCatalog();

})();
</script>
