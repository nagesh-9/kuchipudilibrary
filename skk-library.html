<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sri Bala Tripura Sundari Granthalayam — Library</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tiro+Telugu:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --parchment:#F3ECD9;
    --card:#FBF7EC;
    --ink:#2B2118;
    --ink-soft:#5A4E3E;
    --maroon:#7A2E2E;
    --maroon-dark:#5C2020;
    --gold:#B08D3F;
    --teal:#2F4B3C;
    --line:#DED2AF;
    --danger:#8C2E2E;
    --shadow: 0 2px 10px rgba(43,33,24,0.08);
    --radius: 10px;
    --serif: 'Tiro Telugu', Georgia, 'Times New Roman', serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'JetBrains Mono', 'Courier New', monospace;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      repeating-linear-gradient(135deg, rgba(176,141,63,0.05) 0px, rgba(176,141,63,0.05) 2px, transparent 2px, transparent 14px),
      var(--parchment);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
  }

  /* ---------- top ribbon ---------- */
  .ribbon{
    background: linear-gradient(180deg, var(--maroon) 0%, var(--maroon-dark) 100%);
    color:#F3ECD9;
    padding:18px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    box-shadow: var(--shadow);
    border-bottom: 3px solid var(--gold);
  }
  .ribbon h1{
    font-family:var(--serif);
    font-weight:400;
    font-size:22px;
    margin:0;
    letter-spacing:0.3px;
  }
  .ribbon .sub{
    font-size:12px;
    opacity:0.8;
    margin-top:2px;
    letter-spacing:0.5px;
    text-transform:uppercase;
  }
  .ribbon-right{ display:flex; align-items:center; gap:14px; }

  .status-pill{
    font-family:var(--mono);
    font-size:11px;
    padding:5px 10px;
    border-radius:20px;
    display:flex;
    align-items:center;
    gap:6px;
    background:rgba(0,0,0,0.18);
    white-space:nowrap;
  }
  .dot{ width:7px; height:7px; border-radius:50%; background:#7FA88C; }
  .dot.off{ background:#D9A441; }
  .dot.busy{ background:#D9A441; animation:pulse 1.2s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  button{
    font-family:var(--sans);
    cursor:pointer;
    border:none;
    border-radius:7px;
    padding:9px 16px;
    font-size:13px;
    font-weight:600;
    transition:transform 0.06s ease, opacity 0.15s ease;
  }
  button:active{ transform:scale(0.97); }
  .btn-primary{ background:var(--gold); color:#2B2118; }
  .btn-primary:hover{ opacity:0.9; }
  .btn-ghost{ background:rgba(255,255,255,0.12); color:#F3ECD9; }
  .btn-ghost:hover{ background:rgba(255,255,255,0.2); }
  .btn-outline{ background:transparent; border:1.5px solid var(--maroon); color:var(--maroon); }
  .btn-outline:hover{ background:rgba(122,46,46,0.06); }
  .btn-danger{ background:transparent; color:var(--danger); border:1.5px solid var(--danger); }
  .btn-danger:hover{ background:rgba(140,46,46,0.06); }
  .btn-small{ padding:6px 10px; font-size:12px; }
  button:disabled{ opacity:0.45; cursor:not-allowed; }

  .wrap{ max-width:1080px; margin:0 auto; padding:28px 20px 80px; }

  /* ---------- setup / login screens ---------- */
  .center-screen{
    min-height:calc(100vh - 40px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:36px 34px;
    width:100%;
    max-width:440px;
  }
  .panel-wide{ max-width:620px; }
  .panel h2{
    font-family:var(--serif);
    font-weight:400;
    font-size:24px;
    margin:0 0 6px;
    color:var(--maroon-dark);
  }
  .panel p.hint{ color:var(--ink-soft); font-size:13px; line-height:1.5; margin:0 0 22px; }
  label{ display:block; font-size:12px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.4px; margin:14px 0 6px; }
  label:first-of-type{ margin-top:0; }
  input, select, textarea{
    width:100%;
    padding:10px 12px;
    border:1.5px solid var(--line);
    border-radius:7px;
    font-family:var(--sans);
    font-size:14px;
    background:#fff;
    color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--gold); }
  textarea{ resize:vertical; min-height:70px; }
  .form-actions{ display:flex; gap:10px; margin-top:22px; }
  .error-msg{
    background:#FBEAEA; color:var(--danger); border:1px solid #E7B9B9;
    padding:9px 12px; border-radius:7px; font-size:13px; margin-top:14px;
  }
  .ok-msg{
    background:#EAF2EC; color:var(--teal); border:1px solid #BFD8C7;
    padding:9px 12px; border-radius:7px; font-size:13px; margin-top:14px;
  }
  .link-btn{ background:none; border:none; color:var(--maroon); font-size:12.5px; text-decoration:underline; padding:2px 0; font-weight:500; }

  /* ---------- toolbar ---------- */
  .toolbar{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    margin-bottom:18px; flex-wrap:wrap;
  }
  .search-box{
    flex:1; min-width:220px;
    position:relative;
  }
  .search-box input{
    padding-left:34px;
    background:var(--card);
  }
  .search-box::before{
    content:"⌕"; position:absolute; left:11px; top:50%; transform:translateY(-50%);
    color:var(--ink-soft); font-size:16px;
  }
  .toolbar-actions{ display:flex; gap:8px; flex-wrap:wrap; }

  /* ---------- tabs ---------- */
  .tabs{
    max-width:1080px; margin:0 auto; padding:16px 20px 0; display:flex; gap:6px;
  }
  .tab-btn{
    background:transparent; color:var(--ink-soft); border:none; border-bottom:2.5px solid transparent;
    border-radius:0; padding:8px 4px; margin-right:18px; font-size:13.5px; font-weight:600;
  }
  .tab-btn.active{ color:var(--maroon-dark); border-bottom-color:var(--gold); }
  .tab-btn:hover{ color:var(--maroon-dark); }

  .register-head{
    font-family:var(--serif); font-size:15px; color:var(--maroon-dark);
    padding:14px 16px; border-bottom:1px solid var(--line);
  }

  /* ---------- table ---------- */
  .table-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  thead th{
    text-align:left;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:var(--ink-soft);
    background:rgba(176,141,63,0.10);
    padding:11px 14px;
    border-bottom:1.5px solid var(--line);
    font-weight:700;
  }
  tbody td{
    padding:11px 14px;
    border-bottom:1px solid var(--line);
    vertical-align:top;
  }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:rgba(176,141,63,0.06); }
  .book-title{ font-weight:600; color:var(--maroon-dark); }
  .book-meta{ color:var(--ink-soft); font-size:12px; margin-top:2px; }
  .badge{
    display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:600;
  }
  .badge-avail{ background:#EAF2EC; color:var(--teal); }
  .badge-out{ background:#FBEAEA; color:var(--danger); }
  .row-actions{ display:flex; gap:6px; }
  .empty-state{ text-align:center; padding:60px 20px; color:var(--ink-soft); }
  .empty-state .big{ font-family:var(--serif); font-size:19px; color:var(--maroon-dark); margin-bottom:6px; }

  /* ---------- modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(43,33,24,0.45);
    display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal{
    background:var(--card); border-radius:var(--radius); box-shadow:0 10px 40px rgba(0,0,0,0.25);
    width:100%; max-width:480px; padding:28px 30px; max-height:90vh; overflow-y:auto;
  }
  .modal h3{ font-family:var(--serif); font-weight:400; font-size:20px; margin:0 0 18px; color:var(--maroon-dark); }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }

  /* ---------- users panel ---------- */
  .user-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; border-bottom:1px solid var(--line);
  }
  .user-row:last-child{ border-bottom:none; }
  .role-tag{
    font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px;
    padding:2px 8px; border-radius:20px; background:rgba(176,141,63,0.18); color:var(--gold-dark, #8a6b28);
  }
  .role-tag.admin{ background:rgba(122,46,46,0.12); color:var(--maroon); }

  footer.credit{ text-align:center; color:var(--ink-soft); font-size:11.5px; padding:30px 0 10px; }

  /* ---------- landing page ---------- */
  .landing{ min-height:100vh; display:flex; flex-direction:column; }
  .landing-nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 34px; max-width:1080px; margin:0 auto; width:100%;
  }
  .landing-nav .mark{ font-family:var(--serif); font-size:17px; color:var(--maroon-dark); }
  .thread-motif{ width:100%; overflow:hidden; line-height:0; }
  .landing-hero{
    flex:1; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:40px 24px 60px;
  }
  .landing-hero-inner{ max-width:640px; }
  .eyebrow{
    font-family:var(--mono); font-size:11.5px; letter-spacing:1.6px; text-transform:uppercase;
    color:var(--gold); margin-bottom:18px; display:inline-block;
  }
  .landing-hero h1{
    font-family:var(--serif); font-weight:400; font-size:46px; line-height:1.15;
    color:var(--maroon-dark); margin:0 0 4px;
  }
  .landing-hero h1 span{ display:block; font-size:22px; color:var(--ink-soft); font-style:italic; margin-top:6px; }
  .landing-tagline{
    font-size:15.5px; color:var(--ink-soft); line-height:1.65; max-width:480px;
    margin:22px auto 34px;
  }
  .landing-cta{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .btn-lg{ padding:13px 26px; font-size:14px; }

  .landing-section{ max-width:1080px; margin:0 auto; padding:10px 24px 60px; width:100%; }
  .landing-section h2{
    font-family:var(--serif); font-weight:400; font-size:22px; color:var(--maroon-dark);
    text-align:center; margin:0 0 8px;
  }
  .landing-section .lede{ text-align:center; color:var(--ink-soft); font-size:13.5px; max-width:520px; margin:0 auto 32px; line-height:1.6; }

  .category-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:16px; }
  .category-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px 18px; text-align:center; box-shadow:var(--shadow);
  }
  .category-card .num{
    font-family:var(--mono); font-size:11px; color:var(--gold); letter-spacing:1px; margin-bottom:10px; display:block;
  }
  .category-card h3{ font-family:var(--serif); font-weight:400; font-size:16px; color:var(--maroon-dark); margin:0 0 6px; }
  .category-card p{ font-size:12px; color:var(--ink-soft); line-height:1.5; margin:0; }

  .landing-footer{ text-align:center; padding:24px 20px 34px; color:var(--ink-soft); font-size:11.5px; border-top:1px solid var(--line); }

  /* ---------- toast ---------- */
  #global-toast{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
    background:var(--ink); color:#F3ECD9; padding:11px 18px; border-radius:8px;
    font-size:13px; box-shadow:0 6px 20px rgba(0,0,0,0.25); z-index:200;
    max-width:90vw; display:none;
  }
  #global-toast.toast-error{ background:var(--danger); }
  #global-toast.toast-ok{ background:var(--teal); }

  /* ---------- stats bar ---------- */
  .stats-bar{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .stat-chip{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:10px 16px; min-width:100px; box-shadow:var(--shadow);
  }
  .stat-num{ font-family:var(--serif); font-size:20px; color:var(--maroon-dark); }
  .stat-label{ font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.4px; margin-top:2px; }

  @media (max-width:760px){
    .category-grid{ grid-template-columns:1fr 1fr; }
    .landing-hero h1{ font-size:34px; }
  }
  @media (max-width:480px){
    .category-grid{ grid-template-columns:1fr; }
  }

  /* ---------- print ---------- */
  @media print{
    .no-print{ display:none !important; }
    body{ background:#fff; }
    .table-card{ box-shadow:none; border:none; }
    thead th{ background:#eee !important; -webkit-print-color-adjust:exact; }
  }

  @media (max-width:600px){
    .grid-2{ grid-template-columns:1fr; }
    .ribbon{ flex-direction:column; align-items:flex-start; }
    thead{ display:none; }
    table, tbody, tr, td{ display:block; width:100%; }
    tbody tr{ border-bottom:2px solid var(--line); padding:10px 0; }
    tbody td{ border-bottom:none; padding:4px 14px; }
    tbody td::before{ content: attr(data-label); font-weight:700; text-transform:uppercase; font-size:10px; color:var(--ink-soft); display:block; }
  }
</style>

<!-- Firebase and xlsx load lazily, only once "Sign in" is clicked — see ensureFirebaseSDK() below. -->
<script>
  function loadScript(src){
    return new Promise(function(resolve, reject){
      const s = document.createElement('script');
      s.src = src; s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    });
  }
  let _firebaseSdkLoaded = false;
  function ensureFirebaseSDK(){
    if(_firebaseSdkLoaded) return Promise.resolve();
    return loadScript('https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js')
      .then(function(){
        return Promise.all([
          loadScript('https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js'),
          loadScript('https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js'),
          loadScript('https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js')
        ]);
      })
      .then(function(){ _firebaseSdkLoaded = true; });
  }
</script>

<script>
(function(){
  "use strict";

  const root = document.getElementById('root');
  const CONFIG_KEY = 'skk_lib_firebase_config';
  const ROLE_CACHE_KEY = 'skk_lib_role_cache';

  // Embedded so the app works out of the box on any device/host with no setup step.
  const EMBEDDED_CONFIG = {
    apiKey: "AIzaSyD24jrS3IFcOzztK8mjhHNhgDnPaiajZxs",
    authDomain: "kuchipudi-kala-kshetram-lib.firebaseapp.com",
    projectId: "kuchipudi-kala-kshetram-lib",
    storageBucket: "kuchipudi-kala-kshetram-lib.firebasestorage.app",
    messagingSenderId: "466278077648",
    appId: "1:466278077648:web:eeecb30d321530965f7ad5"
  };

  const CATEGORIES = ["Donated Books", "Telugu University", "Vistara Seva Vibhagam", "UGC"];

  let app=null, auth=null, db=null, secondaryApp=null;
  let currentUser=null;
  let currentUserName=null;
  let currentRole=null; // 'admin' | 'readonly'
  let books=[]; // live cache from Firestore snapshot
  let unsubscribeBooks=null;
  let loans=[]; // live cache of borrow/return records
  let unsubscribeLoans=null;
  let searchTerm='';
  let categoryFilter='';
  let netStatus = navigator.onLine ? 'checking' : 'offline'; // checking | online | offline
  let catalogLoading = false;

  // ---------------- user-facing write/error feedback ----------------
  let toastTimer=null;
  function showToast(message, isError){
    let t = document.getElementById('global-toast');
    if(!t){ t = document.createElement('div'); t.id='global-toast'; document.body.appendChild(t); }
    t.textContent = message;
    t.className = isError ? 'toast-error' : 'toast-ok';
    t.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.style.display='none'; }, 4000);
  }

  function withRoman(b){ b._titleRoman = teluguToRoman(b.title); b._authorRoman = teluguToRoman(b.author); b._donorRoman = teluguToRoman(b.donor); return b; }

  // ---------------- utility ----------------
  function el(tag, attrs, children){
    const e = document.createElement(tag);
    if(attrs) for(const k in attrs){
      if(k==='class') e.className=attrs[k];
      else if(k==='html') e.innerHTML=attrs[k];
      else if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
      else if(k==='disabled' || k==='checked' || k==='selected' || k==='readonly'){
        if(attrs[k]) e.setAttribute(k, '');
      }
      else e.setAttribute(k, attrs[k]);
    }
    (children||[]).forEach(c=>{ if(c) e.appendChild(typeof c==='string'?document.createTextNode(c):c); });
    return e;
  }
  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function fmtDate(ts){
    if(!ts) return '—';
    try{
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'});
    }catch(e){ return '—'; }
  }

  // ============================================================
  // SEARCH ENGINE: accession-number-first ordering + fuzzy Telugu/English matching
  // ============================================================

  // Approximate Telugu -> Roman phonetic transliteration, so an English-typed
  // query ("konchem") can fuzzy-match Telugu text ("కొంచెం") without the person
  // needing a Telugu keyboard. This is phonetic, not a formal transliteration
  // standard — good enough for search, not meant to be linguistically exact.
  const TG_VOWELS = {'అ':'a','ఆ':'aa','ఇ':'i','ఈ':'ii','ఉ':'u','ఊ':'uu','ఋ':'ru','ౠ':'ruu','ఌ':'lu','ౡ':'luu','ఎ':'e','ఏ':'ee','ఐ':'ai','ఒ':'o','ఓ':'oo','ఔ':'au'};
  const TG_CONS = {'క':'ka','ఖ':'kha','గ':'ga','ఘ':'gha','ఙ':'nga','చ':'cha','ఛ':'chha','జ':'ja','ఝ':'jha','ఞ':'nya','ట':'ta','ఠ':'tha','డ':'da','ఢ':'dha','ణ':'na','త':'ta','థ':'tha','ద':'da','ధ':'dha','న':'na','ప':'pa','ఫ':'pha','బ':'ba','భ':'bha','మ':'ma','య':'ya','ర':'ra','ల':'la','వ':'va','శ':'sha','ష':'sha','స':'sa','హ':'ha','ళ':'la','ఱ':'ra','ఴ':'la'};
  const TG_MATRA = {'ా':'aa','ి':'i','ీ':'ii','ు':'u','ూ':'uu','ృ':'ru','ౄ':'ruu','ె':'e','ే':'ee','ై':'ai','ొ':'o','ో':'oo','ౌ':'au'};
  const TG_VIRAMA = '్', TG_ANUSVARA = 'ం', TG_VISARGA = 'ః', TG_CHANDRABINDU = 'ఁ';

  function teluguToRoman(str){
    if(!str) return '';
    const chars = Array.from(String(str));
    let out = '';
    for(let i=0;i<chars.length;i++){
      const ch = chars[i];
      if(TG_CONS[ch]){
        const base = TG_CONS[ch], stem = base.slice(0,-1); // strip inherent trailing 'a'
        const next = chars[i+1];
        if(next===TG_VIRAMA){ out += stem; i++; }
        else if(next && TG_MATRA[next]){ out += stem + TG_MATRA[next]; i++; }
        else { out += base; }
      } else if(TG_VOWELS[ch]){
        out += TG_VOWELS[ch];
      } else if(ch===TG_ANUSVARA){ out += 'm'; }
      else if(ch===TG_VISARGA){ out += 'h'; }
      else if(ch===TG_CHANDRABINDU){ out += 'n'; }
      else if(ch===TG_VIRAMA){ /* stray, skip */ }
      else { out += ch.toLowerCase(); }
    }
    return out;
  }

  function normalizeSearchText(s){
    return String(s||'').toLowerCase().replace(/[\[\]().,\-–—'"]/g, '').replace(/\s+/g, ' ').trim();
  }

  function levenshtein(a, b){
    if(a===b) return 0;
    if(!a.length) return b.length;
    if(!b.length) return a.length;
    let prev = new Array(b.length+1);
    for(let j=0;j<=b.length;j++) prev[j]=j;
    for(let i=1;i<=a.length;i++){
      const cur = [i];
      for(let j=1;j<=b.length;j++){
        cur[j] = Math.min(
          prev[j]+1,
          cur[j-1]+1,
          prev[j-1] + (a[i-1]===b[j-1] ? 0 : 1)
        );
      }
      prev = cur;
    }
    return prev[b.length];
  }

  // Returns 0 (no match), 2 (fuzzy match), or 3 (direct substring match) for query vs one text field.
  function fuzzyFieldScore(query, text){
    if(!query || !text) return 0;
    const nq = normalizeSearchText(query), nt = normalizeSearchText(text);
    if(!nq || !nt) return 0;
    if(nt.indexOf(nq) > -1) return 3;
    const threshold = nq.length<=3 ? 1 : Math.max(1, Math.floor(nq.length*0.3));
    const words = nt.split(' ');
    for(let i=0;i<words.length;i++){
      const w = words[i];
      if(!w) continue;

  // Best score for query against a Telugu field, checking both the raw text
  // and its Roman transliteration (so English typing matches Telugu content).
  function fuzzyTeluguScore(query, rawText, romanText){
    return Math.max(fuzzyFieldScore(query, rawText), fuzzyFieldScore(query, romanText));
  }

  // Natural sort for accession numbers like "01", "1800", "A 01", "D178", "L 849" —
  // groups by leading letters, then compares the numeric part as a number.
  function parseAccession(acc){
    const s = String(acc||'').trim();
    const m = s.match(/^([A-Za-z]*)\s*0*(\d+)(.*)$/);
    if(m) return {prefix:m[1].toUpperCase(), num:parseInt(m[2],10), rest:m[3].trim(), raw:s};
    return {prefix:'', num:Number.MAX_SAFE_INTEGER, rest:s, raw:s};
  }
  function compareAccession(a, b){
    const pa = parseAccession(a), pb = parseAccession(b);
    if(pa.prefix !== pb.prefix) return pa.prefix.localeCompare(pb.prefix);
    if(pa.num !== pb.num) return pa.num - pb.num;
    if(pa.rest !== pb.rest) return pa.rest.localeCompare(pb.rest);
    return pa.raw.localeCompare(pb.raw);
  }

  // Ranks a book against a search query: accession-number matches always
  // outrank title/author matches, per the register's own numbering being
  // the primary way books are found; title/author are complementary.
  function scoreBookAgainstQuery(book, query){
    if(!query) return 1; // no query — everything matches, sort falls through to accession order
    const accScore = fuzzyFieldScore(query, book.accessionNo);
    if(accScore>0) return 1000 + accScore;
    const titleScore = fuzzyTeluguScore(query, book.title, book._titleRoman);
    const authorScore = fuzzyTeluguScore(query, book.author, book._authorRoman);
    const donorScore = fuzzyTeluguScore(query, book.donor, book._donorRoman);
    const categoryText = (book.category||'') + (book.alsoUGC ? ' UGC' : '');
    const categoryScore = fuzzyFieldScore(query, categoryText);
    const isbnScore = fuzzyFieldScore(query, book.isbn);
    return Math.max(titleScore, authorScore, donorScore, categoryScore, isbnScore);
  }

  function sortAndFilterBooks(list, query){
    const q = (query||'').trim();
    const scored = list.map(function(b){ return {book:b, score:scoreBookAgainstQuery(b, q)}; })
      .filter(function(x){ return x.score>0; });
    scored.sort(function(x,y){
      if(y.score !== x.score) return y.score - x.score;
      return compareAccession(x.book.accessionNo, y.book.accessionNo);
    });
    return scored.map(function(x){ return x.book; });

  function teluguLikelihoodScore(text){
    const chars = Array.from(text);

    for(let i=0;i<chars.length-1;i++){

  function transliterateWord(word){
    let pos=0, out='', pending=null;
    const n = word.length;
    while(pos<n){
      const ch = word[pos];
      if(ch==='M'){ if(pending){ out+=pending; pending=null; } out+='ం'; pos++; continue; }
      if(ch==='H'){ if(pending){ out+=pending; pending=null; } out+='ః'; pos++; continue; }
      if(ch==='n' || ch==='m'){
        // "n"/"m" directly before another consonant (no vowel between) is almost
        // always written as anusvara (ం) in Telugu, not spelled out — e.g. "venkata" -> వెంకట, not వెన్కత.
        let nextIsConsonant=false;
        for(let i=0;i<RT_CONSONANTS.length;i++){
          const tok=RT_CONSONANTS[i][0];
          if(word.substr(pos+1, tok.length)===tok){ nextIsConsonant=true; break; }
        }
        if(nextIsConsonant){
          if(pending){ out+=pending; pending=null; }
          out += 'ం';
          pos += 1;
          continue;
        }
      }
      let mc=null;
      for(let i=0;i<RT_CONSONANTS.length;i++){
        const tok=RT_CONSONANTS[i][0];
        if(word.substr(pos, tok.length)===tok){ mc=RT_CONSONANTS[i]; break; }
      }
      if(mc){
        if(pending) out += pending + '్';
        pending = mc[1];
        pos += mc[0].length;
        continue;
      }
      let mv=null;
      for(let i=0;i<RT_VOWELS.length;i++){
        const tok=RT_VOWELS[i][0];
        if(word.substr(pos, tok.length)===tok){ mv=RT_VOWELS[i]; break; }
      }
      if(mv){
        if(pending){ out += pending + mv[2]; pending=null; }
        else { out += mv[1]; }
        pos += mv[0].length;
        continue;
      }
      if(pending){ out+=pending; pending=null; }
      out += ch;
      pos++;
    }
    if(pending) out += pending;
    return out;
  }

  // ---------------- real-word dictionary (ranks candidates, doesn't just guess) ----------------
  // ~125k real Telugu words (LibreOffice's open-source spell-check dictionary).
  // Loaded lazily on first use, not at page load — guests who never type never fetch it.
  let _teluguDict = null;
  let _teluguDictLoading = null;
  function loadTeluguDictionary(){
    if(_teluguDict) return Promise.resolve(_teluguDict);
    if(_teluguDictLoading) return _teluguDictLoading;
    _teluguDictLoading = fetch('/te-dictionary.txt').then(function(res){
      if(!res.ok) throw new Error('no dictionary');
      return res.text();
    }).then(function(text){
      _teluguDict = new Set(text.split('\n').map(function(w){ return w.trim(); }).filter(Boolean));
      return _teluguDict;
    }).catch(function(){
      _teluguDict = new Set(); // offline / local file with no server — fall back to heuristic-only ranking
      return _teluguDict;
    });
    return _teluguDictLoading;
  }

  // Generates plausible alternate ROMAN spellings around the sounds that are
  // genuinely ambiguous when typing Telugu casually (dental vs retroflex
  // t/d/n, s vs sh, and final vowel length) — then transliterates each and
  // lets the real-word dictionary decide which are actually correct words.
  function generateRomanVariants(word){
    const variants = new Set([word]);
    function swap(re, repl){ if(re.test(word)) variants.add(word.replace(re, repl)); }
    swap(/t/g,'T'); swap(/T/g,'t');
    swap(/d/g,'D'); swap(/D/g,'d');
    swap(/n/g,'N'); swap(/N/g,'n');
    if(/s(?!h)/.test(word)) variants.add(word.replace(/s(?!h)/g,'sh'));
    if(/sh/.test(word)) variants.add(word.replace(/sh/g,'s'));
    const finalSwap = {'a':null,'i':'ii','u':'uu','e':'E','o':'O','I':'i','U':'u','E':'e','O':'o'};
    const last = word.slice(-1);
    if(finalSwap[last]) variants.add(word.slice(0,-1) + finalSwap[last]);
    if(/t/.test(word) && /d/.test(word)) variants.add(word.replace(/t/g,'T').replace(/d/g,'D'));
    return Array.from(variants);
  }

  // Returns up to 5 candidate Telugu renderings, dictionary-confirmed real
  // words first, falling back to heuristic-only readings to fill the rest.
  function generateCandidates(word){
    if(!/[a-zA-Z]/.test(word)) return {candidates:[transliterateWord(word)], anyInDict:false};
    const dict = _teluguDict || new Set();
    const romanVariants = generateRomanVariants(word);
    const seen = new Map();
    romanVariants.forEach(function(rv, idx){
      const tel = transliterateWord(rv);
      if(!seen.has(tel)) seen.set(tel, {inDict: dict.has(tel), priority: idx, likelihood: teluguLikelihoodScore(tel)});
    });
    const list = Array.from(seen.entries()).map(function(e){
      return {text:e[0], inDict:e[1].inDict, priority:e[1].priority, likelihood:e[1].likelihood};
    });
    list.sort(function(a,b){
      if(a.inDict !== b.inDict) return a.inDict ? -1 : 1;
      if(!a.inDict){ // among non-dictionary candidates, prefer more "Telugu-sounding" letter sequences
        const diff = b.likelihood - a.likelihood;
        if(Math.abs(diff) > 0.05) return diff;
      }
      return a.priority - b.priority;
    });
    return {
      candidates: list.slice(0,5).map(function(x){ return x.text; }),
      anyInDict: list.some(function(x){ return x.inDict; })
    };
  }

  function getSuggestBox(){
    if(!_suggestBox){
      _suggestBox = document.createElement('div');
      _suggestBox.style.cssText = 'position:absolute; z-index:500; background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:0 6px 20px rgba(0,0,0,0.18); font-size:13.5px; overflow:hidden; display:none; font-family:var(--serif);';
      document.body.appendChild(_suggestBox);
    }
    return _suggestBox;
  }
  function hideSuggestBox(){ getSuggestBox().style.display='none'; }

  const _lastConvertedRange = new WeakMap(); // input -> {start, end} of the most recently auto-converted word

  function applySuggestion(input, candidate){
    const info = _lastConvertedRange.get(input);
    if(!info) return;
    const value = input.value;
    const newValue = value.slice(0, info.start) + candidate + value.slice(info.end);
    input.value = newValue;
    const newEnd = info.start + candidate.length;
    _lastConvertedRange.set(input, {start:info.start, end:newEnd});
    input.focus();
    input.setSelectionRange(newEnd, newEnd);
  }

  function showSuggestions(input, candidates, anyInDict){
    const showHint = !anyInDict;
    if(candidates.length<=1 && !showHint){ hideSuggestBox(); return; }
    const box = getSuggestBox();
    box.innerHTML='';
    candidates.forEach(function(cand, i){
      const item = el('div', {
        style:'padding:7px 14px; cursor:pointer; white-space:nowrap; display:flex; gap:8px; align-items:baseline;',
        onmousedown:function(e){ e.preventDefault(); applySuggestion(input, cand); hideSuggestBox(); }
      }, [
        el('span', {style:'font-family:var(--mono); font-size:10.5px; color:var(--ink-soft);'}, [String(i+1)]),
        el('span', null, [cand])
      ]);
      item.addEventListener('mouseenter', function(){ item.style.background='rgba(176,141,63,0.12)'; });
      item.addEventListener('mouseleave', function(){ item.style.background=''; });
      box.appendChild(item);
    });
    if(showHint){
      box.appendChild(el('div', {style:'padding:7px 14px; font-size:11.5px; color:var(--ink-soft); border-top:1px solid var(--line); font-family:var(--sans);'}, [
        'No exact match — try a candidate above, or type it as separate syllables and press Ctrl+J to join them.'
      ]));
    }
    const rect = input.getBoundingClientRect();
    box.style.left = (rect.left + window.scrollX) + 'px';
    box.style.top = (rect.bottom + window.scrollY + 4) + 'px';
    box.style.minWidth = rect.width + 'px';
    box.style.display='block';
  }

  // Attaches Telugu typing to a text input: converts each word as you finish
  // typing it (space, or blur for the last word) and shows up to 5 ranked
  // candidates in a dropdown to pick from. Ctrl+E toggles English for that
  // field. `defaultTelugu:false` starts the field in English mode instead.
  const _teluguInputState = new WeakMap();
  function attachTeluguTransliteration(input, opts){
    const defaultOn = !(opts && opts.defaultTelugu===false);
    _teluguInputState.set(input, {enabled:defaultOn});
    input.style.borderColor = defaultOn ? '' : 'var(--maroon)';
    input.title = defaultOn
      ? 'Types in Telugu — Ctrl+E for English. Ctrl+J joins syllables you built separately.'
      : 'English mode — Ctrl+E for Telugu typing.';
    loadTeluguDictionary(); // warm the cache so it's ready by the time they type

    input.addEventListener('keydown', function(e){
      if(e.ctrlKey && (e.key==='e' || e.key==='E')){
        e.preventDefault();
        const st = _teluguInputState.get(input);
        st.enabled = !st.enabled;
        input.style.borderColor = st.enabled ? '' : 'var(--maroon)';
        input.title = st.enabled ? 'Telugu mode — Ctrl+E for English' : 'English mode — Ctrl+E for Telugu';
        hideSuggestBox();
        return;
      }
      // Ctrl+J: if a word won't come out right as one piece (rare names, conjuncts),
      // type it as separate syllable chunks with spaces, then join them into one word.
      if(e.ctrlKey && (e.key==='j' || e.key==='J')){
        e.preventDefault();
        input.value = joinTeluguRuns(input.value);
        input.setSelectionRange(input.value.length, input.value.length);
        hideSuggestBox();
        return;
      }
      // Pick a suggestion with 1-5 right after a word converts, before typing continues.
      if(/^[1-5]$/.test(e.key) && getSuggestBox().style.display==='block' && _lastConvertedRange.get(input)){
        const idx = Number(e.key)-1;
        const items = getSuggestBox().children;
        if(items[idx]){
          e.preventDefault();
          items[idx].dispatchEvent(new Event('mousedown', {bubbles:true, cancelable:true}));
          return;
        }
      }
      if(e.key!==' '){ hideSuggestBox(); }
      if(e.key===' '){
        const st = _teluguInputState.get(input);
        if(!st || !st.enabled) return;
        const pos = input.selectionStart;
        const value = input.value;
        const before = value.slice(0,pos);
        const after = value.slice(pos);
        const lastSpace = before.lastIndexOf(' ');
        const word = before.slice(lastSpace+1);
        if(word && /[a-zA-Z]/.test(word)){
          e.preventDefault();
          const result = generateCandidates(word);
          const top = result.candidates[0];
          const wordStart = lastSpace+1;
          const newBefore = before.slice(0,wordStart) + top + ' ';
          input.value = newBefore + after;
          const caretPos = newBefore.length;
          input.setSelectionRange(caretPos, caretPos);
          _lastConvertedRange.set(input, {start:wordStart, end:wordStart+top.length});
          showSuggestions(input, result.candidates, result.anyInDict);
        }
      }
    });
    input.addEventListener('blur', function(){
      setTimeout(hideSuggestBox, 150); // delay so a suggestion click (mousedown) still registers first
      const st = _teluguInputState.get(input);
      if(!st || !st.enabled) return;
      const value = input.value;
      const lastSpace = value.lastIndexOf(' ');
      const word = value.slice(lastSpace+1);
      if(word && /[a-zA-Z]/.test(word)){
        input.value = value.slice(0,lastSpace+1) + generateCandidates(word).candidates[0];
      }
    });
  }

  // Merges consecutive space-separated pure-Telugu tokens into single words —
  // e.g. after typing a rare name syllable-by-syllable ("kri Sh Na" each
  // converting on its own), Ctrl+J collapses them into one word. Mixed-in
  // English words or already-single Telugu words are left untouched.
  function joinTeluguRuns(value){
    const tokens = value.split(' ');
    const isTeluguToken = function(t){ return t.length>0 && /^[\u0C00-\u0C7F]+$/.test(t); };
    const out = [];
    let buffer = '';
    tokens.forEach(function(tok){
      if(isTeluguToken(tok)){
        buffer += tok;
      } else {
        if(buffer){ out.push(buffer); buffer=''; }
        out.push(tok);
      }
    });
    if(buffer) out.push(buffer);
    return out.join(' ');
  }

  // ---------------- firebase init ----------------
  function initFirebase(cfg){
    try{
      if(!app){
        app = firebase.initializeApp(cfg);
        auth = firebase.auth();
        db = firebase.firestore();
        db.enablePersistence({synchronizeTabs:true}).catch(function(err){
          console.warn('Persistence not enabled:', err.code);
        });
      }
      return true;
    }catch(e){
      console.error(e);
      return false;
    }

  function renderSetup(prefill, errorMsg){
    root.innerHTML='';
    const wrap = el('div', {class:'center-screen'});
    const panel = el('div', {class:'panel panel-wide'});
    panel.appendChild(el('h2', null, ['Connect the library']));
    panel.appendChild(el('p', {class:'hint'}, [
      'This is a one-time setup on this device/site. Paste the Firebase project config from your Firebase Console → Project Settings → Your apps → SDK setup and configuration. It is stored only in this browser and is safe to keep here — real security is enforced by Firestore rules, not by hiding this.'
    ]));

    const ta = el('textarea', {rows:10, placeholder:'{\n  "apiKey": "...",\n  "authDomain": "...",\n  "projectId": "...",\n  "storageBucket": "...",\n  "messagingSenderId": "...",\n  "appId": "..."\n}'});
    if(prefill) ta.value = prefill;
    panel.appendChild(el('label', null, ['Firebase config (JSON)']));
    panel.appendChild(ta);

    if(errorMsg) panel.appendChild(el('div', {class:'error-msg'}, [errorMsg]));

    const actions = el('div', {class:'form-actions'});
    const btn = el('button', {class:'btn-primary', style:'flex:1', onclick: function(){
      let parsed;
      try{ parsed = JSON.parse(ta.value); }
      catch(e){ renderSetup(ta.value, 'That is not valid JSON. Paste the exact object from Firebase Console.'); return; }
      if(!parsed.apiKey || !parsed.projectId){
        renderSetup(ta.value, 'Config looks incomplete — needs at least apiKey and projectId.'); return;
      }
      setConfig(parsed);
      const ok = initFirebase(parsed);
      if(!ok){ renderSetup(ta.value, 'Could not connect with this config. Double check it.'); return; }
      boot();
    }}, ['Connect']);
    actions.appendChild(btn);
    panel.appendChild(actions);

    panel.appendChild(el('p', {class:'hint', style:'margin-top:18px; margin-bottom:0;'}, [
      'Don\u2019t have a Firebase project yet? Go to console.firebase.google.com → Add project → (free Spark plan is enough) → Build → Firestore Database → Create database → Build → Authentication → Sign-in method → enable Email/Password. Then Project Settings → add a Web app to get this config.'
    ]));

    wrap.appendChild(panel);
    root.appendChild(wrap);

  function enterGuestCatalog(){
    currentUser = null;
    currentRole = 'guest';
    currentUserName = null;
    currentView = 'catalog';
    if(unsubscribeLoans){ unsubscribeLoans(); unsubscribeLoans=null; }
    if(unsubscribeBooks){ unsubscribeBooks(); unsubscribeBooks=null; }

    catalogLoading = true;
    books = [];
    renderApp();

    // Public reads never touch Firestore — this is a plain HTTP request to the
    // Python backend, which keeps its own live-synced copy. The browser's normal
    // HTTP cache (via the server's ETag/Cache-Control headers) handles repeat
    // visits; there's no custom caching code here at all.
    fetch('/api/books')
      .then(function(res){
        if(!res.ok) throw new Error('status ' + res.status);
        return res.json();
      })
      .then(function(data){
        books = data.map(withRoman);
        catalogLoading = false;
        netStatus = 'online';
        renderApp();
      })
      .catch(function(){
        // Most likely this file is open locally (e.g. admin's desktop copy)
        // with no Python server behind it — that's fine, sign in instead.
        catalogLoading = false;
        netStatus = 'offline';
        books = [];
        renderApp();
      });
  }

  function renderLogin(errorMsg){
    root.innerHTML='';
    const wrap = el('div', {class:'center-screen'});
    const panel = el('div', {class:'panel'});
    panel.appendChild(el('h2', null, ['శ్రీ బాలా త్రిపుర సుందరి గ్రంథాలయం']));
    panel.appendChild(el('p', {class:'hint'}, ['Library catalog — sign in to continue.']));

    const emailInp = el('input', {type:'email', placeholder:'you@example.com', autocomplete:'username'});
    const passInp = el('input', {type:'password', placeholder:'••••••••', autocomplete:'current-password'});
    panel.appendChild(el('label', null, ['Email']));
    panel.appendChild(emailInp);
    panel.appendChild(el('label', null, ['Password']));
    panel.appendChild(passInp);

    const msgHolder = el('div');
    if(errorMsg) msgHolder.appendChild(el('div', {class:'error-msg'}, [errorMsg]));
    panel.appendChild(msgHolder);

    const doLogin = function(){
      const email = emailInp.value.trim(), pass = passInp.value;
      if(!email || !pass){ renderLogin('Enter both email and password.'); return; }
      if(!auth){ renderLogin('Not connected to Firebase yet. Reload the page.'); return; }
      auth.signInWithEmailAndPassword(email, pass).catch(function(err){
        renderLogin(friendlyAuthError(err));
      });
      // success handled by onAuthStateChanged
    };

    const actions = el('div', {class:'form-actions'});
    actions.appendChild(el('button', {class:'btn-primary', style:'flex:1', onclick:doLogin}, ['Sign in']));
    panel.appendChild(actions);
    passInp.addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });

    panel.appendChild(el('div', {style:'margin-top:18px;'}, [
      el('button', {class:'link-btn', onclick:function(){ enterGuestCatalog(); }}, ['← Back'])
    ]));

    wrap.appendChild(panel);
    root.appendChild(wrap);
    emailInp.focus();
  }

  function friendlyAuthError(err){
    const map = {
      'auth/invalid-email':'That email address looks invalid.',
      'auth/user-disabled':'This account has been disabled.',
      'auth/user-not-found':'No account with that email.',
      'auth/wrong-password':'Incorrect password.',
      'auth/invalid-credential':'Incorrect email or password.',
      'auth/network-request-failed':'No network — sign in needs internet the first time on a device.',
      'auth/too-many-requests':'Too many attempts. Wait a bit and try again.',
      'auth/email-already-in-use':'That email is already registered.',
      'auth/weak-password':'Password should be at least 6 characters.'
    };
    return map[err.code] || (err.message || 'Something went wrong signing in.');
  }

    searchBox.appendChild(searchInp);

    const catFilter = el('select', {style:'width:auto; min-width:170px;', onchange:function(e){ categoryFilter=e.target.value; renderTableOnly(); }});

  function buildStatsBar(){
    const live = books.filter(function(b){ return !b.deleted; });
    const totalBooks = live.length;
    const totalCopies = live.reduce(function(s,b){ return s+Number(b.copiesTotal||0); }, 0);
    const availCopies = live.reduce(function(s,b){ return s+Number(b.copiesAvailable!=null?b.copiesAvailable:b.copiesTotal||0); }, 0);
    const outCopies = Math.max(0, totalCopies-availCopies);
    const bar = el('div', {class:'stats-bar no-print'});
    [
      [totalBooks, 'titles'],
      [totalCopies, 'total copies'],
      [availCopies, 'available'],
      [outCopies, 'checked out']
    ].forEach(function(pair){
      const stat = el('div', {class:'stat-chip'});
      stat.appendChild(el('div', {class:'stat-num'}, [String(pair[0])]));
      stat.appendChild(el('div', {class:'stat-label'}, [pair[1]]));
      bar.appendChild(stat);
    });
    return bar;
  }

  function saveBook(id, data, existing){
    if(!db) return;
    const promise = id
      ? db.collection('books').doc(id).set(data, {merge:true})
      : (function(){ data.addedAt = firebase.firestore.FieldValue.serverTimestamp(); return db.collection('books').add(data); })();
    promise.catch(function(err){
      showToast('Could not save the book: ' + (err.message||'unknown error'), true);
    });
  }
  function deleteBook(id){
    if(!db) return;
    db.collection('books').doc(id).set({deleted:true, updatedAt: firebase.firestore.FieldValue.serverTimestamp()}, {merge:true})
      .then(function(){ showToast('Book removed.'); })
      .catch(function(err){ showToast('Could not remove the book: ' + (err.message||'unknown error'), true); });
  }
  function restoreBook(id){
    if(!db) return;
    db.collection('books').doc(id).set({deleted:false, updatedAt: firebase.firestore.FieldValue.serverTimestamp()}, {merge:true})
      .then(function(){ showToast('Book restored.'); })
      .catch(function(err){ showToast('Could not restore the book: ' + (err.message||'unknown error'), true); });
  }

  function csvEscape(val){
    const s = String(val==null?'':val);
    if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
    return s;
  }

  function renderDownloadModal(){
    const close = function(){ downloadModalOpen=false; renderApp(); };
    const backdrop = el('div', {class:'modal-backdrop', onclick:function(e){ if(e.target===backdrop) close(); }});
    const modal = el('div', {class:'modal'});
    modal.appendChild(el('h3', null, ['Download catalog']));
    modal.appendChild(el('p', {class:'hint'}, ['Export as a CSV file (opens in Excel/Sheets). Leave the range blank to download everything in the selected category.']));

    const catSel = el('select');
    catSel.appendChild(el('option', {value:''}, ['All categories']));
    CATEGORIES.forEach(function(c){ catSel.appendChild(el('option', {value:c}, [c])); });
    modal.appendChild(el('label', null, ['Category']));
    modal.appendChild(catSel);

    const fromInp = el('input', {type:'text', placeholder:'e.g. DN1 (leave blank for start)'});
    const toInp = el('input', {type:'text', placeholder:'e.g. DN500 (leave blank for end)'});
    const g = el('div', {class:'grid-2'});
    const c1 = el('div'); c1.appendChild(el('label',null,['From accession no.'])); c1.appendChild(fromInp);
    const c2 = el('div'); c2.appendChild(el('label',null,['To accession no.'])); c2.appendChild(toInp);
    g.appendChild(c1); g.appendChild(c2);
    modal.appendChild(g);

    const countHolder = el('p', {class:'hint'});
    modal.appendChild(countHolder);

    function matching(){
      const cat = catSel.value, from = fromInp.value.trim(), to = toInp.value.trim();
      return books.filter(function(b){
        if(b.deleted) return false;
        if(cat && b.category!==cat) return false;
        if(from && compareAccession(b.accessionNo, from) < 0) return false;
        if(to && compareAccession(b.accessionNo, to) > 0) return false;
        return true;
      });
    }
    function refreshCount(){
      countHolder.textContent = matching().length + ' book(s) match this selection.';
    }
    catSel.addEventListener('change', refreshCount);
    fromInp.addEventListener('input', refreshCount);
    toInp.addEventListener('input', refreshCount);
    refreshCount();

    const actions = el('div', {class:'form-actions'});
    actions.appendChild(el('button', {class:'btn-outline', onclick:close}, ['Cancel']));
    actions.appendChild(el('button', {class:'btn-primary', style:'flex:1', onclick:function(){
      const rows = matching().sort(function(a,b){ return compareAccession(a.accessionNo,b.accessionNo); });
      const headers = ['Accession No','Title','Author','Category','Donor','Publisher','Year','Pages','ISBN','Copies Total','Copies Available'];
      const lines = [headers.map(csvEscape).join(',')];
      rows.forEach(function(b){
        lines.push([
          b.accessionNo, b.title, b.author, b.category, b.donor||'', b.publisher||'',
          b.year||'', b.pages||'', b.isbn||'', b.copiesTotal||0, (b.copiesAvailable!=null?b.copiesAvailable:b.copiesTotal||0)
        ].map(csvEscape).join(','));
      });
      const csv = '\uFEFF' + lines.join('\r\n'); // BOM so Excel opens Telugu text correctly
      const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
      const url = URL.createObjectURL(blob);
      const from = fromInp.value.trim(), to = toInp.value.trim();
      const rangeTag = (from||to) ? ('_'+(from||'start')+'-'+(to||'end')) : '';
      const catTag = catSel.value ? ('_'+catSel.value.replace(/\s+/g,'')) : '';
      const a = document.createElement('a');
      a.href = url;
      a.download = 'catalog' + catTag + rangeTag + '.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      close();
    }}, ['Download CSV']));
    modal.appendChild(actions);

    backdrop.appendChild(modal);
    root.appendChild(backdrop);
  }





  // ============================================================
  // IMPORT FROM SPREADSHEET (xlsx / csv)
  // ============================================================
  const IMPORT_FIELDS = [
    {key:'', label:'— Ignore this column —'},
    {key:'title', label:'Title'},
    {key:'author', label:'Author'},
    {key:'accessionNo', label:'Accession / register no.'},
    {key:'pages', label:'Pages'},
    {key:'year', label:'Year'},
    {key:'publisher', label:'Publisher'},
    {key:'isbn', label:'ISBN'}
  ];

  let importFileRows=null;   // array of arrays, row 0 = header
  let importMapping=null;    // array parallel to header columns -> field key
  let importCategory='';
  let importFileName='';
  let importUploading=false;
  let importResult=null;     // {count} once done

  function guessColumnMapping(header, sampleValue){
    const h = String(header||'').toLowerCase();
    if(h.indexOf('గ్రంధ')>-1 || h.indexOf('పుస్తక')>-1 || h.indexOf('title')>-1) return 'title';
    if(h.indexOf('రచయిత')>-1 || h.indexOf('author')>-1) return 'author';
    if(h.indexOf('పేజీ')>-1 || h.indexOf('page')>-1) return 'pages';
    if(h.indexOf('సంవత్సర')>-1 || h.indexOf('year')>-1) return 'year';
    if(h.indexOf('ప్రచురణకర్త')>-1 || h.indexOf('publisher')>-1) return 'publisher';
    if(h.indexOf('isbn')>-1) return 'isbn';
    if(h.indexOf('క్రమ')>-1 || h.indexOf('సంఖ్య')>-1){
      const sv = String(sampleValue||'').trim();
      if(sv && /[A-Za-z]/.test(sv)) return 'accessionNo'; // alphanumeric id like "A 01" — a real accession no
      return ''; // plain running serial number — not useful as an id, ignore by default
    }
    return '';
  }

  function resetImportState(){
    importFileRows=null; importMapping=null; importCategory=''; importFileName=''; importUploading=false; importResult=null;
  }

  function renderImportModal(){
    const closeImport = function(){ importModalOpen=false; resetImportState(); renderApp(); };
    const backdrop = el('div', {class:'modal-backdrop', onclick:function(e){ if(e.target===backdrop && !importUploading) closeImport(); }});
    const modal = el('div', {class:'modal', style:'max-width:640px;'});
    modal.appendChild(el('h3', null, ['Import spreadsheet']));

    if(importResult){
      modal.appendChild(el('div', {class:'ok-msg'}, ['Added ' + importResult.count + ' book' + (importResult.count===1?'':'s') + ' to the catalog under "' + importCategory + '".']));
      modal.appendChild(el('div', {class:'form-actions'}, [
        el('button', {class:'btn-primary', style:'flex:1', onclick:closeImport}, ['Done'])
      ]));
      backdrop.appendChild(modal);
      root.appendChild(backdrop);
      return;
    }

    if(!importFileRows){
      modal.appendChild(el('p', {class:'hint'}, ['Upload an Excel (.xlsx) or CSV file exported from their register. The first row should be column headers — you\u2019ll confirm what each column means on the next step before anything is saved.']));

      modal.appendChild(el('label', null, ['Which collection does this file belong to? *']));
      const catSel = el('select');
      catSel.appendChild(el('option', {value:''}, ['— Select category —']));
      CATEGORIES.forEach(function(c){ catSel.appendChild(el('option', {value:c}, [c])); });
      catSel.addEventListener('change', function(e){ importCategory = e.target.value; });
      modal.appendChild(catSel);

      modal.appendChild(el('label', null, ['File']));
      const fileInp = el('input', {type:'file', accept:'.xlsx,.xls,.csv'});
      const errHolder = el('div');
      fileInp.addEventListener('change', function(e){
        errHolder.innerHTML='';
        if(!importCategory){
          errHolder.innerHTML=''; errHolder.appendChild(el('div',{class:'error-msg'},['Pick a category first.']));
          fileInp.value='';
          return;
        }
        const file = e.target.files[0];
        if(!file) return;
        importFileName = file.name;
        const reader = new FileReader();
        reader.onload = function(ev){
          try{
            const data = new Uint8Array(ev.target.result);
            const wb = XLSX.read(data, {type:'array'});
            const ws = wb.Sheets[wb.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''}).filter(function(r){
              return r.some(function(cell){ return String(cell).trim()!==''; });
            });
            if(rows.length<2){
              errHolder.innerHTML=''; errHolder.appendChild(el('div',{class:'error-msg'},['That file has no data rows below the header.']));
              return;
            }
            importFileRows = rows;
            importMapping = rows[0].map(function(h, i){ return guessColumnMapping(h, rows[1] ? rows[1][i] : ''); });
            renderApp();
          }catch(err){
            errHolder.innerHTML=''; errHolder.appendChild(el('div',{class:'error-msg'},['Could not read that file: ' + (err.message||'unknown error')]));
          }
        };
        reader.readAsArrayBuffer(file);
      });
      modal.appendChild(fileInp);
      modal.appendChild(errHolder);

      modal.appendChild(el('div', {class:'form-actions'}, [
        el('button', {class:'btn-outline', style:'flex:1', onclick:closeImport}, ['Cancel'])
      ]));
      backdrop.appendChild(modal);
      root.appendChild(backdrop);
      return;
    }

    // --- Step 2: mapping + preview ---
    const header = importFileRows[0];
    const dataRows = importFileRows.slice(1);
    modal.appendChild(el('p', {class:'hint'}, [importFileName + ' — ' + dataRows.length + ' row' + (dataRows.length===1?'':'s') + ' found, importing into "' + importCategory + '". Check the column mapping below before uploading.']));

    const mapTable = el('table');
    const mapThead = el('thead'); const mapHr = el('tr');
    ['Column in file','Sample value','Maps to'].forEach(function(h){ mapHr.appendChild(el('th', null, [h])); });
    mapThead.appendChild(mapHr); mapTable.appendChild(mapThead);
    const mapTbody = el('tbody');
    header.forEach(function(h, idx){
      const tr = el('tr');
      tr.appendChild(el('td', null, [String(h||'(blank)')]));
      tr.appendChild(el('td', null, [el('span',{style:'color:var(--ink-soft); font-size:12px;'},[String(dataRows[0] ? dataRows[0][idx] : '')])]));
      const sel = el('select', {style:'font-size:12.5px; padding:6px 8px;'});
      IMPORT_FIELDS.forEach(function(f){
        const opt = el('option', {value:f.key}, [f.label]);
        if(importMapping[idx]===f.key) opt.selected = true;
        sel.appendChild(opt);
      });
      sel.addEventListener('change', function(e){ importMapping[idx]=e.target.value; renderApp(); });
      const tdSel = el('td'); tdSel.appendChild(sel);
      tr.appendChild(tdSel);
      mapTbody.appendChild(tr);
    });
    mapTable.appendChild(mapTbody);
    const mapCard = el('div', {class:'table-card', style:'margin:14px 0;'});
    mapCard.appendChild(mapTable);
    modal.appendChild(mapCard);

    const hasTitle = importMapping.indexOf('title') > -1;
    if(!hasTitle){
      modal.appendChild(el('div', {class:'error-msg'}, ['At least one column must map to "Title" before importing.']));
    }

    const titleIdx = importMapping.indexOf('title');
    const accIdx = importMapping.indexOf('accessionNo');
    const missingTitleRows = [];
    const accCounts = {};
    dataRows.forEach(function(row, i){
      const t = titleIdx>-1 ? String(row[titleIdx]||'').trim() : '';
      if(!t) missingTitleRows.push(i+1);
      if(accIdx>-1){
        const acc = String(row[accIdx]||'').trim();
        if(acc) accCounts[acc] = (accCounts[acc]||0)+1;
      }
    });
    const duplicateAccs = Object.keys(accCounts).filter(function(k){ return accCounts[k]>1; });
    const validCount = dataRows.length - missingTitleRows.length;

    modal.appendChild(el('p', {class:'hint'}, [validCount + ' of ' + dataRows.length + ' rows have a title and will be imported. Every book is added with 1 total / 1 available copy — adjust individual counts afterward if needed.']));

    if(missingTitleRows.length>0){
      modal.appendChild(el('div', {class:'error-msg'}, [
        missingTitleRows.length + ' row' + (missingTitleRows.length===1?'':'s') + ' will be skipped — no title (row' + (missingTitleRows.length===1?'':'s') + ' ' + missingTitleRows.slice(0,12).join(', ') + (missingTitleRows.length>12?', …':'') + ').'
      ]));
    }
    if(duplicateAccs.length>0){
      modal.appendChild(el('div', {class:'error-msg'}, [
        duplicateAccs.length + ' accession number' + (duplicateAccs.length===1?'':'s') + ' repeated within this file: ' + duplicateAccs.slice(0,12).join(', ') + (duplicateAccs.length>12?', …':'') + '. These will still import — worth checking for duplicate rows before uploading.'
      ]));
    }

    const progressHolder = el('div');
    modal.appendChild(progressHolder);

    const actions = el('div', {class:'form-actions'});
    actions.appendChild(el('button', {class:'btn-outline', disabled: importUploading, onclick:function(){ importFileRows=null; importMapping=null; renderApp(); }}, ['\u2190 Choose a different file']));
    const uploadBtn = el('button', {class:'btn-primary', style:'flex:1', disabled: !hasTitle || importUploading || validCount===0, onclick:function(){
      importUploading = true;
      progressHolder.innerHTML='';
      progressHolder.appendChild(el('div', {class:'ok-msg'}, ['Uploading…']));
      uploadImportedBooks(dataRows, header, importMapping, importCategory, importFileName, function(done, total){
        progressHolder.innerHTML='';
        progressHolder.appendChild(el('div', {class:'ok-msg'}, ['Uploading ' + done + ' of ' + total + '…']));
      }).then(function(res){
        importUploading = false;
        importResult = res;
        renderApp();
      }).catch(function(err){
        importUploading = false;
        progressHolder.innerHTML='';
        progressHolder.appendChild(el('div', {class:'error-msg'}, ['Import failed: ' + (err.message||'unknown error')]));
      });
    }}, [importUploading ? 'Uploading…' : ('Import ' + validCount + ' book' + (validCount===1?'':'s'))]);
    actions.appendChild(uploadBtn);
    modal.appendChild(actions);

    backdrop.appendChild(modal);
    root.appendChild(backdrop);
  }

  function uploadImportedBooks(dataRows, header, mapping, category, filename, onProgress){
    const colFor = {};
    mapping.forEach(function(field, idx){ if(field) colFor[field]=idx; });

    const rows = dataRows.map(function(row){
      if(colFor.title==null) return null;
      const title = String(row[colFor.title]||'').trim();
      if(!title) return null;
      const get = function(key){ return colFor[key]!=null ? String(row[colFor[key]]||'').trim() : ''; };
      return {
        title: title,
        author: get('author'),
        accessionNo: get('accessionNo'),
        pages: get('pages'),
        year: get('year'),
        publisher: get('publisher'),
        isbn: get('isbn'),
        category: category,
        copiesTotal: 1,
        copiesAvailable: 1,
        deleted: false,
        importedFrom: filename,
        addedAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };
    }).filter(Boolean);

    const CHUNK = 400;
    const chunks = [];
    for(let i=0;i<rows.length;i+=CHUNK) chunks.push(rows.slice(i, i+CHUNK));

    let uploaded = 0;
    function next(i){
      if(i>=chunks.length){ return Promise.resolve({count: uploaded}); }
      const batch = db.batch();
      chunks[i].forEach(function(rowData){
        batch.set(db.collection('books').doc(), rowData);
      });
      return batch.commit().then(function(){
        uploaded += chunks[i].length;
        if(onProgress) onProgress(uploaded, rows.length);
        return next(i+1);
      });
    }
    return next(0);
  }

  function todayStr(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function normalizeMobile(m){
    let digits = String(m||'').replace(/\D/g,'');
    if(digits.length>10) digits = digits.slice(-10); // strip country code like +91
    return digits;
  }
  function isValidMobile(m){
    return /^[0-9]{10}$/.test(normalizeMobile(m));
  }
  // Date strings are 'YYYY-MM-DD', which compare correctly with plain string comparison.
  function isValidBorrowDate(dateStr){
    return !!dateStr && dateStr <= todayStr();
  }
  function isValidReturnDate(dateStr, borrowDateStr){
    return !!dateStr && dateStr <= todayStr() && (!borrowDateStr || dateStr >= borrowDateStr);
  }
  function fmtDateStr(s){
    if(!s) return '—';
    const parts = String(s).split('-');
    if(parts.length!==3) return s;
    const d = new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
    return d.toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'});
  }
  function daysBetween(startStr){
    if(!startStr) return '—';
    const parts = startStr.split('-');
    const start = new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
    const diff = Math.round((new Date().setHours(0,0,0,0) - start.setHours(0,0,0,0)) / 86400000);
    return diff + (diff===1?' day':' days');
  }

  function borrowBook(book, name, mobile, date){
    const bookRef = db.collection('books').doc(book.id);
    const loanRef = db.collection('loans').doc();
    return db.runTransaction(function(tx){
      return tx.get(bookRef).then(function(doc){
        if(!doc.exists) throw new Error('That book no longer exists.');
        const avail = Number(doc.data().copiesAvailable!=null ? doc.data().copiesAvailable : doc.data().copiesTotal||0);
        if(avail<=0) throw new Error('No copies available to borrow.');
        tx.update(bookRef, {copiesAvailable: avail-1, updatedAt: firebase.firestore.FieldValue.serverTimestamp()});
        tx.set(loanRef, {
          bookId: book.id,
          bookTitle: book.title,
          borrowerName: name,
          borrowerMobile: mobile,
          borrowDate: date,
          returnDate: null,
          returnerName: null,
          returnerMobile: null,
          status: 'out',
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          createdBy: currentUser.uid
        });
      });
    });
  }

  function returnBook(loan, returnDate, returnerName, returnerMobile, sameAsBorrower){
    const bookRef = db.collection('books').doc(loan.bookId);
    const loanRef = db.collection('loans').doc(loan.id);
    return db.runTransaction(function(tx){
      return tx.get(bookRef).then(function(doc){
        const data = doc.exists ? doc.data() : {copiesAvailable:0, copiesTotal:0};
        const total = Number(data.copiesTotal||0);
        const avail = Number(data.copiesAvailable||0);
        const newAvail = total>0 ? Math.min(avail+1, total) : avail+1;
        if(doc.exists){
          tx.update(bookRef, {copiesAvailable:newAvail, updatedAt: firebase.firestore.FieldValue.serverTimestamp()});
        }
        tx.update(loanRef, {
          status:'returned',
          returnDate: returnDate,
          returnerName: returnerName,
          returnerMobile: returnerMobile,
          sameAsBorrower: !!sameAsBorrower,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      });
    });
  }

  function createLogin(name, email, pass, role){
    const cfg = getConfig() || EMBEDDED_CONFIG;
    if(!secondaryApp){
      secondaryApp = firebase.apps.find(a=>a.name==='Secondary') || firebase.initializeApp(cfg, 'Secondary');
    }
    const secondaryAuth = secondaryApp.auth();
    return secondaryAuth.createUserWithEmailAndPassword(email, pass).then(function(cred){
      const uid = cred.user.uid;
      return secondaryAuth.signOut().then(function(){
        return db.collection('roles').doc(uid).set({
          name: name,
          email: email,
          role: role,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          createdBy: currentUser.uid
        });
      });
    });
  }

    });
  }

  function subscribeLoans(){
    if(unsubscribeLoans) unsubscribeLoans();
    unsubscribeLoans = db.collection('loans').onSnapshot(function(snap){
      loans = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      if(currentView==='register' && document.getElementById('view-holder')) renderViewOnly();
    }, function(err){
      console.error('loans snapshot error', err);
      showToast('Lost the connection to the borrowing register — it will retry automatically.', true);
    });
  }

  let everSignedIn = false;

  function boot(){
    if(!auth){ renderSetup(); return; }
    auth.onAuthStateChanged(function(user){
      if(!user){
        currentUser=null; currentRole=null; currentUserName=null;
        if(unsubscribeBooks){ unsubscribeBooks(); unsubscribeBooks=null; }
        if(unsubscribeLoans){ unsubscribeLoans(); unsubscribeLoans=null; }
        if(everSignedIn){ enterGuestCatalog(); } else { renderLogin(); }
        return;
      }
      everSignedIn = true;
      currentUser = user;
      netStatus = navigator.onLine ? 'online' : 'offline';

      db.collection('roles').doc(user.uid).get().then(function(doc){
        if(doc.exists){
          const d = doc.data();
          currentRole = d.role === 'admin' ? 'admin' : 'readonly';
          currentUserName = d.name || null;
          cacheRole(user.uid, currentRole);
        } else {
          currentRole = getCachedRole(user.uid) || 'readonly';
        }
        subscribeBooks();
        subscribeLoans();
        renderApp();
      }).catch(function(){
        currentRole = getCachedRole(user.uid) || 'readonly';
        subscribeBooks();
        subscribeLoans();
        renderApp();
      });
    });
  }

  // Called by the "Sign in" button — this is the only thing that ever triggers
  // loading the Firebase SDK or making a Firebase network call. Nothing before
  // this point (public browsing) touches Firebase in any way.
  function startSignIn(){
    ensureFirebaseSDK().then(function(){
      const activeConfig = getConfig() || EMBEDDED_CONFIG;
      const ok = initFirebase(activeConfig);
      if(!ok){
        renderSetup(JSON.stringify(activeConfig, null, 2), 'Could not connect. Check the config and try again.');
        return;
      }
      boot();
    }).catch(function(){
      showToast('Could not load sign-in — check your connection.', true);
    });
  }

  // ---------------- entry point ----------------
  // Default state: public catalog view, served entirely by the Python backend.
  // No Firebase code loads and no Firebase calls happen until startSignIn() runs.
  enterGuestCatalog();

})();
</script>
